<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ff8fb1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>El Bailarín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --shell:#fff1c9; --shell-dark:#f2c46d; --ink:#3b2340; --pink:#ff6f9f; --screen:#c9e7c2;
  --btn:#ffd2e0; --btn-dark:#e78aac; --sea:#3fa7c9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Pixelify Sans",ui-monospace,monospace;color:var(--ink);
  background:linear-gradient(180deg,#ffcf8f 0%,#ff9fb8 45%,#7fd0e8 100%) fixed;
  display:flex;justify-content:center;align-items:flex-start;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;
}
.egg{
  width:min(100%,420px);background:var(--shell);
  border-radius:46% 46% 34% 34% / 22% 22% 16% 16%;
  box-shadow:inset 0 -10px 0 var(--shell-dark), 0 8px 0 rgba(59,35,64,.25), 0 14px 30px rgba(59,35,64,.25);
  padding:26px 20px 30px;position:relative;
  background-image:radial-gradient(circle at 20% 15%,rgba(255,111,159,.18) 0 8px,transparent 9px),
                   radial-gradient(circle at 80% 22%,rgba(63,167,201,.18) 0 10px,transparent 11px),
                   radial-gradient(circle at 12% 70%,rgba(63,167,201,.15) 0 7px,transparent 8px),
                   radial-gradient(circle at 88% 78%,rgba(255,111,159,.15) 0 9px,transparent 10px);
}
h1{margin:0 0 6px;text-align:center;font-size:24px;letter-spacing:2px;color:var(--pink);
   text-shadow:2px 2px 0 var(--ink)}
.sub{text-align:center;font-size:13px;margin-bottom:8px;opacity:.75}
.clock{text-align:center;font-size:16px;font-weight:700;margin:-2px 0 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
.swaprow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
#stars{font-weight:700;font-size:15px}
.card h3{margin:10px 0 4px;font-size:16px}
.ward{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:5px 8px;margin:4px 0;font-size:15px}
.ward button{font-size:14px;padding:5px 8px;box-shadow:0 2px 0 var(--btn-dark);white-space:nowrap}
.ward button:disabled{opacity:.5}
#swap,#helpBtn{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--btn-dark);cursor:pointer}
#swap:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-dark)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;margin:0 6px 10px}
.bar{display:flex;align-items:center;gap:4px;font-size:12px}
.bar .ic{width:18px;text-align:center;font-size:14px}
.bar .tr{flex:1;height:9px;background:#fff;border:2px solid var(--ink);position:relative}
.bar .fi{position:absolute;left:0;top:0;bottom:0;background:#5cc96b;transition:width .4s}
.bar .fi.mid{background:#f5c542}.bar .fi.low{background:#ef5b5b}
.screenwrap{position:relative;border:4px solid var(--ink);border-radius:10px;overflow:hidden;
  box-shadow:inset 0 0 0 3px #8fb38a;background:var(--screen);touch-action:manipulation}
canvas{display:block;width:100%;aspect-ratio:1/1;image-rendering:pixelated;image-rendering:crisp-edges}
.bubble{position:absolute;left:8px;right:8px;top:8px;background:#fff;border:3px solid var(--ink);
  border-radius:8px;padding:6px 8px;font-size:15px;line-height:1.2;display:none;z-index:3;
  box-shadow:3px 3px 0 rgba(59,35,64,.3)}
.bubble.show{display:block;animation:pop .2s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.bubble .brow{display:flex;gap:8px;margin-top:6px}
.bubble .brow button{flex:1;font-family:inherit;font-size:15px;border:3px solid var(--ink);border-radius:8px;padding:6px;background:var(--btn);color:var(--ink);box-shadow:0 3px 0 var(--btn-dark)}
.bubble .brow button:first-child{background:#9be3a8;box-shadow:0 3px 0 #4fae62}
.game{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;display:none}
.game.show{display:block}
.game .lbl{background:rgba(255,255,255,.9);border:3px solid var(--ink);border-radius:6px;padding:3px 6px;
  font-size:14px;text-align:center;margin-bottom:5px}
.track{height:22px;background:#fff;border:3px solid var(--ink);position:relative;border-radius:4px}
.zone{position:absolute;top:0;bottom:0;background:#7be08a}
.cursor{position:absolute;top:-6px;bottom:-6px;width:6px;background:var(--pink);border:2px solid var(--ink);margin-left:-3px}
.rescue{display:none;margin-top:8px;background:#3b2340;color:#ffe9a8;border-radius:6px;padding:6px 8px;font-size:14px;text-align:center}
.rescue.show{display:block}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.menu button{font-family:inherit;font-size:12px;color:var(--ink);background:var(--btn);border:3px solid var(--ink);
  border-radius:12px;padding:6px 2px 5px;box-shadow:0 4px 0 var(--btn-dark);cursor:pointer;line-height:1.1}
.menu button .e{display:block;font-size:22px;margin-bottom:2px}
.menu button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-dark)}
.menu button:disabled{opacity:.35;filter:grayscale(1)}
.modal{position:fixed;inset:0;background:rgba(59,35,64,.55);display:none;align-items:center;justify-content:center;
  z-index:10;padding:16px}
.modal.show{display:flex}
.card{background:var(--shell);border:4px solid var(--ink);border-radius:14px;padding:16px;width:min(100%,380px);
  max-height:85vh;overflow:auto;box-shadow:6px 6px 0 rgba(59,35,64,.4)}
.card h2{margin:0 0 8px;color:var(--pink);text-shadow:1px 1px 0 var(--ink)}
.card p{margin:6px 0;font-size:16px;line-height:1.3}
.card .opts{display:grid;gap:8px;margin-top:10px}
.card button{font-family:inherit;font-size:16px;background:var(--btn);border:3px solid var(--ink);border-radius:10px;
  padding:9px;box-shadow:0 4px 0 var(--btn-dark);color:var(--ink);cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-dark)}
.st{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:15px;margin:8px 0}
.st .tr{height:10px;background:#fff;border:2px solid var(--ink);position:relative}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;text-align:center;font-size:13px}
.gifts div{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px}
.gifts b{display:block;font-size:22px}
.note{background:#fff;border:2px dashed var(--pink);border-radius:8px;padding:6px;font-size:14px;margin:4px 0}
.over{text-align:center}
.over .big{font-size:38px;color:#ef3b6b;text-shadow:3px 3px 0 var(--ink);margin:6px 0}
.foot{text-align:center;font-size:11px;opacity:.6;margin-top:10px}
</style>

</head>
<body>
<div class="egg">
  <h1>EL BAILARÍN</h1>
  <div class="sub" id="sub">la mascota de María</div>
  <div class="swaprow"><span id="stars">⭐ 5</span><button id="swap" type="button"></button><button id="helpBtn" type="button">❔ Ayuda</button></div>
  <div class="clock" id="clock"></div>
  <div class="bars" id="bars"></div>
  <div class="screenwrap" id="screen">
    <canvas id="cv" width="96" height="96"></canvas>
    <div class="bubble" id="bubble"></div>
    <div class="game" id="game"><div class="lbl" id="gameLbl"></div><div class="track"><div class="zone" id="zone"></div><div class="cursor" id="cursor"></div></div></div>
  </div>
  <div class="rescue" id="rescue"></div>
  <div class="menu" id="menu">
    <button data-a="eat"><span class="e">🍜</span>Comer</button>
    <button data-a="surf"><span class="e">🏄</span>Surfear</button>
    <button data-a="dance"><span class="e">💃</span>Bailar</button>
    <button data-a="sleep"><span class="e">😴</span><span id="sleepLbl">Dormir</span></button>
    <button data-a="shower"><span class="e">🚿</span>Ducharse</button>
    <button data-a="bed"><span class="e">❤️</span>Acostarse</button>
    <button data-a="status"><span class="e">📋</span>Estado</button>
    <button data-a="closet"><span class="e">👕</span>Armario</button>
  </div>
  <div class="foot">Toca al Bailarín para darle mimos · se guarda solo</div>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
// ====================== ESTADO Y GUARDADO ======================
const PETS=['bailarin','maria'];
const HASH=(location.hash||'').replace('#','');
let PET = PETS.includes(HASH)?HASH:null;
const SELECTING = !PET;
if(!PET){ try{ PET=localStorage.getItem('el-bailarin-last-pet'); }catch(e){} if(!PETS.includes(PET)) PET='bailarin'; }
const IS_M = PET==='maria';
const KEY = IS_M ? 'el-bailarin-pet-maria-v1' : 'el-bailarin-maria-v1';
const YOU = IS_M ? 'Bailarín' : 'María';
const RATES = {food:12.5, energy:8.3, clean:7, happy:10, fit:4.2, anemic:4.2}; // puntos por hora
const BARS = [
  ['food','🍜','Hambre'],['energy','⚡','Energía'],['clean','🧼','Limpieza'],
  ['happy','😊','Felicidad'],['fit','💪','Forma física'],['anemic','🩸','Estado anémico']
];
const GIFT_TYPES = {
  chuche:{e:'🍬',n:'Chuches'}, concha:{e:'🐚',n:'Conchas'}, flor:{e:'🌸',n:'Flores'}, nota:{e:'💌',n:'Notas'}
};
const NOTES = [
  'María, eres mi kinesfera favorita.',
  'Si fueras una ola, te surfearía con respeto.',
  'Hoy he bailado una pieza sobre ti. Duraba 40 minutos y lloraba todo el rato.',
  'Gracias por no dejarme bebiendo vino en la calle. Te debo una contracción.',
  'Eres más bonita que un atardecer en la playa después de un ensayo.',
  'Pina Bausch estaría orgullosa de cómo me cuidas.',
  'He escrito tu nombre en la arena con un pie en relevé.',
  'Contigo hasta los pliés me salen bien.'
];
function fresh(keep){
  const now = Date.now();
  return {v:1, born:now, last:now, stats:{food:85,energy:85,clean:85,happy:85,fit:75,anemic:75},
    mode:'ok', sleeping:false, wineHours:0, rescue:{eat:false,shower:false,surf:false}, lowLove:0,
    lastCuddle:0, lastPat:0, gifts:(keep&&keep.gifts)||{}, notes:(keep&&keep.notes)||[], owned:keep&&keep.owned, outfit:keep&&keep.outfit, stars:keep&&keep.stars, trips:(keep&&keep.trips)||{}, lastTrip:0, lastTripId:null, floorGift:null, giftTimer:0,
    cause:null, introSeen:!!(keep&&keep.introSeen), generation:((keep&&keep.generation)||0)+1, deaths:(keep&&keep.deaths)||0};
}
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return s; }catch(e){} return null; }
function save(){ try{ S.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() || fresh();
let CAN_SAVE = false; try{ localStorage.setItem('__t','1'); CAN_SAVE = localStorage.getItem('__t')==='1'; localStorage.removeItem('__t'); }catch(e){}
S.trips = S.trips || {}; S.lastTrip = S.lastTrip || 0;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

const clamp = v => Math.max(0, Math.min(100, v));
function healthy(){ const s=S.stats; return s.food>30 && s.clean>30 && s.fit>30; }

function goWine(){
  S.mode='wine'; S.sleeping=false; S.wineHours=0; S.rescue={eat:false,shower:false,surf:false};
  S.floorGift=null;
}
function gameOver(cause){ S.mode='over'; S.cause=cause; S.sleeping=false; S.deaths=(S.deaths||0)+1; S.floorGift=null; }

function step(h){ // h = horas
  if(S.mode==='over') return;
  if(S.mode==='wine'){ S.wineHours += h; if(S.wineHours>=24) gameOver('wine'); return; }
  const s=S.stats, k = S.sleeping?0.5:1;
  s.food-=RATES.food*h*k; s.clean-=RATES.clean*h*k; s.happy-=RATES.happy*h*k;
  s.fit-=RATES.fit*h*k; s.anemic-=RATES.anemic*h*k;
  if(S.sleeping){ s.energy+=25*h; if(s.energy>=100){ s.energy=100; S.sleeping=false; S.justWoke=true; } }
  else { s.energy-=RATES.energy*h; if(s.energy<=0){ s.energy=0; S.sleeping=true; } }
  for(const b of BARS) s[b[0]] = clamp(s[b[0]]);
  if(s.food<=0 || s.clean<=0 || s.fit<=0){ goWine(); return; }
  if(healthy() && s.happy<20 && s.anemic<20){ S.lowLove+=h; if(S.lowLove>=12){ gameOver('tinder'); return; } }
  else S.lowLove=0;
  const avg = BARS.reduce((a,b)=>a+s[b[0]],0)/6;
  if(avg>55 && !S.floorGift && !S.sleeping){
    S.giftTimer+=h;
    if(S.giftTimer>=0.25){ S.giftTimer=0; spawnGift(); }
  }
}
function spawnGift(){
  const r=Math.random(), type = r<.35?'chuche':r<.6?'concha':r<.82?'flor':'nota';
  S.floorGift={type, x: 12+Math.floor(Math.random()*70)};
}

// Ponerse al día con el tiempo que la app estuvo cerrada
(function catchUp(){
  const before = {mode:S.mode};
  let hours = Math.min((Date.now()-S.last)/3600000, 24*30);
  const dt = 1/60;
  while(hours>0 && S.mode!=='over'){ const d=Math.min(dt,hours); step(d); hours-=d; }
  S.welcome = before.mode!==S.mode ? S.mode : null;
  S.last = Date.now();
})();

// ====================== DIBUJO PIXEL ART ======================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=96, H=96, GROUND=84;
let SX=1, SCX=48; // escala horizontal para giros
function R(x,y,w,h,c){ ctx.fillStyle=c; let X=x; if(SX!==1){ X = SCX + (x-SCX)*SX; } ctx.fillRect(Math.round(X),Math.round(y),w,h); }
function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function line(x0,y0,x1,y1,w,c){ const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0))); for(let i=0;i<=n;i++){ const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n; R(x-w/2,y-w/2,w,w,c);} }
function disc(x,y,r,c){ for(let j=-r;j<=r;j++){ const half=Math.floor(Math.sqrt(r*r-j*j)+.35); R(x-half,y+j,half*2+1,1,c);} }
const dv = d => { const a=d*Math.PI/180; return [Math.sin(a), Math.cos(a)]; };
const add=(p,v,k)=>[p[0]+v[0]*k, p[1]+v[1]*k];

const COL = {skin:'#e9ad7e', skinD:'#c98a5c', pale:'#efdcd3', paleD:'#d4bdb3', hair:'#f8d65a', hairD:'#d9a937',
  eye:'#58c8ff', pupil:'#1d4e89', mouth:'#8a2d3b', shirt:'#ffffff', shirtD:'#d8d8e8', shorts:'#2fa3c4', shortsD:'#1f7891', blush:'#ff8fa8'};
const HAIR = IS_M?'#221a22':COL.hair, HAIRD = IS_M?'#3e2f3e':COL.hairD, EYE = IS_M?'#7a4a26':COL.eye;
const SHIRT = IS_M?'#ff7a59':COL.shirt, SHIRTD = IS_M?'#e0583a':COL.shirtD, SHORTS = IS_M?'#2b2b38':COL.shorts;

const POSES = {
  stand:{t:0, la:12,le:6, ra:12,re:6, ll:6,lk:0, rl:6,rk:0},
  cielo:{t:0, la:160,le:-10, ra:150,re:15, ll:4,lk:0, rl:14,rk:0, face:'o', swing:2},
  arabesque:{t:-38, la:95,le:0, ra:115,re:-10, ll:2,lk:0, rl:100,rk:0, face:'closed', swing:-3},
  suelo:{t:84, dy:13, la:165,le:25, ra:70,re:20, ll:10,lk:25, rl:25,rk:35, face:'o'},
  contraccion:{t:8, dy:6, la:-35,le:-70, ra:-35,re:-70, ll:40,lk:-75, rl:40,rk:-75, face:'sad'},
  grito:{t:-18, la:125,le:-35, ra:150,re:110, ll:22,lk:0, rl:-4,rk:0, face:'o', swing:4},
  salto:{t:0, dy:-11, la:135,le:0, ra:135,re:0, ll:75,lk:0, rl:75,rk:0, face:'smile', swing:-2},
  caida:{t:62, dy:9, la:170,le:0, ra:40,re:30, ll:30,lk:30, rl:5,rk:0, face:'closed', swing:5},
  giro:{t:0, la:90,le:0, ra:90,re:0, ll:4,lk:0, rl:40,rk:-60, face:'closed', spin:true},
  surf:{t:-10, dy:3, la:80,le:10, ra:85,re:-15, ll:22,lk:-12, rl:22,rk:-12, face:'smile', swing:3},
  wipe:{t:130, dy:-2, la:150,le:0, ra:160,re:20, ll:40,lk:0, rl:60,rk:30, face:'o'},
  sit:{t:0, dy:6, la:20,le:40, ra:35,re:-80, ll:70,lk:-70, rl:65,rk:-75, face:'flat'},
  eat:{t:0, la:12,le:6, ra:30,re:-140, ll:6,lk:0, rl:6,rk:0, face:'chomp'},
  lie:{t:90, dy:13, la:10,le:0, ra:10,re:0, ll:4,lk:0, rl:4,rk:0, face:'closed'},
  shower:{t:0, la:150,le:40, ra:150,re:40, ll:6,lk:0, rl:6,rk:0, face:'happyclosed'},
  trip:{t:25, dy:3, la:120,le:0, ra:60,re:0, ll:-10,lk:0, rl:30,rk:0, face:'o'},
  bikeP:{t:-20, la:-60,le:-20, ra:-70,re:10, ll:-40,lk:60, rl:-20,rk:70, face:'smile'},
};
const DANCE_MOVES = ['cielo','arabesque','suelo','contraccion','grito','salto','caida','giro'];
const DANCE_WORDS = {cielo:'¡AL CIELO!', arabesque:'¡ARABESQUE!', suelo:'¡EL SUELO ME ENTIENDE!', contraccion:'¡CONTRACCIÓN!', grito:'¡GRITO INTERIOR!', salto:'¡SALTO!', caida:'¡CAÍDA DRAMÁTICA!', giro:'¡GIRO ETERNO!'};

function lerpPose(a,b,k){ const o={}; const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  for(const key of keys){ const va=a[key], vb=b[key]; if(typeof va==='number'||typeof vb==='number') o[key]=(va||0)+((vb||0)-(va||0))*k; else o[key]= k<.5?va:vb; } return o; }

function drawGuy(p, o){
  const OF=outfitColors();
  const t = p.t||0;
  const hip=[o.x+(p.dx||0), o.y+(p.dy||0)];
  const up=[Math.sin(t*Math.PI/180), -Math.cos(t*Math.PI/180)], down=[-up[0],-up[1]];
  const perp=[Math.cos(t*Math.PI/180), Math.sin(t*Math.PI/180)];
  const skin = o.pale?COL.pale:COL.skin, skinD = o.pale?COL.paleD:COL.skinD;
  const L=IS_M?0.88:1; const head=add(hip,up,19*L), sb=add(hip,up,12*L);
  SCX = hip[0]; SX = o.sx!==undefined?o.sx:1;
  // pelo largo por detrás
  const swing = (p.swing||0) + (o.swing||0);
  const HL=IS_M?9:10;
  for(let i=0;i<=HL;i++){
    const c=add(add(head,down,i), perp, swing*i/10 + (o.wild?Math.sin(i*1.7)*1.2:0));
    const wdt = 6 - (i>HL-3?(i-(HL-3)):0)*.6;
    line(c[0]-perp[0]*wdt, c[1]-perp[1]*wdt, c[0]+perp[0]*wdt, c[1]+perp[1]*wdt, 2, i>HL*0.65?HAIRD:HAIR);
  }
  // piernas
  const lh=add(hip,perp,-2.5), rh=add(hip,perp,2.5);
  const legs=[[lh,-t-(p.ll||0),-(p.lk||0)],[rh,-t+(p.rl||0),(p.rk||0)]];
  // nota: ángulo del mundo = -t ± ...; dv usa 0 = abajo
  for(const [h0,a1,a2] of legs){
    const d1=dv(a1), knee=add(h0,d1,8*L), d2=dv(a1+a2), foot=add(knee,d2,8*L);
    line(h0[0],h0[1],knee[0],knee[1],IS_M?3:4,skin);
    line(knee[0],knee[1],foot[0],foot[1],3,skin);
    line(h0[0],h0[1],h0[0]+d1[0]*5,h0[1]+d1[1]*5,5,OF.s);
    R(foot[0]-1.5,foot[1]-1,3,2,skinD);
  }
  // pantalón
  line(lh[0],lh[1],rh[0],rh[1],6,OF.s);
  // torso (camiseta de tirantes)
  const tw = IS_M?(o.fofo?9:7):(o.fofo?11:8);
  line(hip[0]+up[0]*1,hip[1]+up[1]*1, sb[0],sb[1], tw, OF.c);
  if(OF.pat==='stripes'){ for(const k of [-2,0,2]){ const a0=add(add(hip,up,1),perp,k), a1=add(sb,perp,k); line(a0[0],a0[1],a1[0],a1[1],1,'#ffffff'); } }
  if(OF.pat==='dots'){ for(const [k,h] of [[-2,3],[2,5],[0,8],[-2,10],[2,1]]){ const q=add(add(hip,up,h),perp,k); R(q[0],q[1],1,1,'#ff4f7b'); } }
  if(o.fofo){ const b=add(hip,up,4); disc(b[0],b[1],4,OF.c); }
  // tirantes y hombros de piel
  const SW=IS_M?4:5.5; const ls=add(sb,perp,-SW), rs=add(sb,perp,SW);
  if(!IS_M){ const c1=add(sb,down,2.5); line(c1[0]-perp[0]*4.5,c1[1]-perp[1]*4.5,c1[0]+perp[0]*4.5,c1[1]+perp[1]*4.5,5,OF.c);
    const pc=add(c1,down,2.5); for(const k of [-2.5,-1.5,1.5,2.5]){ const q=add(pc,perp,k); R(q[0],q[1],1,1,OF.d); } const ab=add(hip,up,4); R(ab[0],ab[1],1,1,OF.d); }
  R(ls[0]-1.5,ls[1]-1.5,3,3,skin); R(rs[0]-1.5,rs[1]-1.5,3,3,skin);
  const neck=add(hip,up,14*L); line(sb[0],sb[1],neck[0],neck[1],IS_M?3:4,skin);
  if(o.dirty){ for(const [a,b] of [[-2,4],[1,7],[2,2],[-1,9]]){ const q=add(add(hip,up,b),perp,a); R(q[0],q[1],1,1,'#8b6a43'); } }
  // brazos
  const arms=[[ls,-t-(p.la||0),-(p.le||0)],[rs,-t+(p.ra||0),(p.re||0)]];
  // corrección: dv(0) = abajo. El "abajo" del cuerpo es -t... usamos ángulo del mundo directamente
  for(const [s0,a1,a2] of arms){
    const d1=dv(a1), el=add(s0,d1,7*L), d2=dv(a1+a2), hand=add(el,d2,6*L);
    line(s0[0],s0[1],el[0],el[1],IS_M?3:4,skin); line(el[0],el[1],hand[0],hand[1],3,skin);
    R(hand[0]-1,hand[1]-1,2,2,skinD);
  }
  o.hand = add(add(rs,dv(-t+(p.ra||0)),7*L), dv(-t+(p.ra||0)+(p.re||0)),6*L);
  if(IS_M && S.injuredUntil>Date.now()){ const ce=add(rs,dv(-t+(p.ra||0)),7*L); line(ce[0],ce[1],o.hand[0],o.hand[1],4,'#f4f4f4'); }
  if(o.mic){ R(o.hand[0]-1,o.hand[1]-4,2,4,'#3b3b3b'); disc(o.hand[0],o.hand[1]-5,1,'#9a9aa8'); }
  if(o.can){ R(o.hand[0]-1,o.hand[1]-4,3,5,'#1f5f3a'); R(o.hand[0]-1,o.hand[1]-3,3,1,'#e8c35a'); }
  // cabeza: pelo, cara, flequillo
  const hc=add(head,up,0.6);
  disc(hc[0],hc[1],6,HAIR);
  const fc=add(head,down,0.8);
  disc(fc[0],fc[1],4,skin);
  const P=(lx,ly)=>add(add(head,perp,lx),down,ly);
  // flequillo
  for(let i=-5;i<=3;i++){ const q=P(i, -3.6 + (i>0? (i*0.35):0)); R(q[0],q[1],1,2,HAIR); }
  { const q=P(-5,-1); R(q[0],q[1],1,3,HAIRD); const q2=P(5,-1); R(q2[0],q2[1],1,3,HAIRD); }
  // ojos
  const face = o.face || p.face || 'smile';
  const eyesClosed = face==='closed'||face==='happyclosed'||o.sleepy===2;
  for(const ex of [-2,2]){
    const q=P(ex,0);
    if(eyesClosed) R(q[0]-0.5,q[1]+0.5,2,1,COL.pupil);
    else if(o.sleepy===1 || o.drunk){ R(q[0]-0.5,q[1]+0.5,2,1,EYE); R(q[0]-0.5,q[1],2,1,skinD); }
    else { R(q[0]-0.5,q[1],2,2,EYE); R(q[0]+0.5,q[1],1,1,COL.pupil); R(q[0]-0.5,q[1]-1,2,1,HAIRD); }
    if(o.pale){ const b=P(ex,1.8); R(b[0]-0.5,b[1],2,1,'#a98fb5'); }
    if(o.blush){ const b=P(ex*1.6,1.6); R(b[0],b[1],1,1,COL.blush); }
  }
  // boca
  const m=P(0,2.8);
  if(face==='smile'||face==='happyclosed'){ R(m[0]-1,m[1],1,1,COL.mouth); R(m[0],m[1]+1,1,1,COL.mouth); R(m[0]+1,m[1],1,1,COL.mouth); }
  else if(face==='sad'){ R(m[0]-1,m[1]+1,1,1,COL.mouth); R(m[0],m[1],1,1,COL.mouth); R(m[0]+1,m[1]+1,1,1,COL.mouth); }
  else if(face==='o'){ R(m[0]-0.5,m[1],2,2,COL.mouth); }
  else if(face==='chomp'){ if(Math.floor(o.time/180)%2) R(m[0]-0.5,m[1],2,2,COL.mouth); else R(m[0]-1,m[1]+1,3,1,COL.mouth); }
  else { R(m[0]-1,m[1]+1,3,1,COL.mouth); }
  if(IS_M && S.injuredUntil>Date.now()){ const q=P(-3,-2); R(q[0],q[1],2,1,'#f0d2a8'); }
  if(o.dirty){ // moscas
    for(let i=0;i<2;i++){ const a=o.time/300+i*3; R(head[0]+Math.cos(a)*9, head[1]-4+Math.sin(a*1.3)*5,1,1,'#222'); }
  }
  drawAcc(P, head, hip, up, perp, sb);
  SX=1;
  return {head, hip};
}

function showCloset(){

      const owned=S.owned.includes(k), on=S.outfit[slot]===k;

      return `<div class="ward"><span>${it.n}</span>${btn}</div>`;
    }).join('');
    return `<h3>${SLOT_NAMES[slot]}</h3>${rows}`;
  }).join('');
  modal(`<h2>👕 Armario ${IS_M?'de María':'del Bailarín'}</h2>

  const look={time:now, dirty:s.clean<30, pale:s.anemic<30, fofo:s.fit<30, sleepy: s.energy<25?1:0};

  if(S.mode==='over'){ renderOver(now); return; }
  if(S.mode==='wine' && !(anim && (anim.type==='surf'||anim.type==='bike'))){
    sceneStreet();
    const p={...POSES.sit};
    p.ra = 35+Math.sin(now/900)*15; // bebe

  if(anim && anim.type==='bike'){ renderBike(now,look); drawFloating(now); return; }
  if(anim && anim.type==='cuddle'){ renderCuddle(now,look); return; }
  if(anim && anim.type==='trip'){ renderTrip(now,look); return; }

    drawGuy(POSES.lie,{...look, x:30, y:GROUND-21-4, face:'closed'});
    rect(40,66,34,8,'#9b89e0'); // manta
    if(Math.floor(now/700)%3===0 && floating.length<4) floating.push({x:52,y:50,t0:now,kind:'z'});

  }

  if(S.floorGift) drawGift(S.floorGift,now);

  let p=curPose, x=guyX, opts={...look};

    const prog=(now-anim.start)/anim.dur;

    p={...POSES.shower, la:150+Math.sin(now/150)*20, ra:150+Math.cos(now/150)*20};
    opts={...opts, face:'happyclosed', dirty:false, sx:1};
    drawGuy(p,{...opts,x,y:GROUND-16});
    for(let i=0;i<14;i++){ const dx=((i*7)%20)-10, dy=((now/4+i*13)%70); R(guyX+dx,6+dy,1,2,'#7fd0ff'); }
    for(let i=0;i<6;i++){ const a=now/400+i; disc(guyX+Math.cos(a)*8, GROUND-28+Math.sin(a*1.3)*10, 1+(i%2),'rgba(255,255,255,.9)'); }

  } else if(anim && anim.type==='eat'){
    p=POSES.eat; const o={...opts, x, y:GROUND-16, face:'chomp'};

    if(prog<0.8) drawFood(anim.food, Math.round(o.hand[0]), Math.round(o.hand[1]));
    if(prog>=1) endAnim();
  } else if(anim && anim.type==='dance'){
    renderDance(now,opts);
  } else {
    // reposo: paseíto y florituras de baile
    if(!flourish && now>nextFlourish && !game){
      flourish={move:DANCE_MOVES[Math.floor(Math.random()*DANCE_MOVES.length)], until:now+1800};
      setPose(flourish.move,350);
    }
    if(flourish && now>flourish.until){ flourish=null; setPose('stand',400); nextFlourish=now+5000+Math.random()*7000; }
    let walking=false;
    if(!flourish){
      if(Math.abs(walkTarget-guyX)<1){ if(Math.random()<0.004) walkTarget=18+Math.random()*60; }
      else { guyX+=Math.sign(walkTarget-guyX)*(s.fit<30?0.12:0.25); walking=true; }
    }
    p={...curPose};
    let sx=1;
    if(flourish && POSES[flourish.move].spin){ sx=Math.cos(now/90); p.la=90; p.ra=90; }
    if(walking && !flourish){ const w=Math.sin(now/120); p.ll=6+w*10; p.rl=6-w*10; p.la=12-w*8; p.ra=12+w*8; }
    const bob = !flourish ? Math.round(Math.sin(now/400)) : 0;
    drawGuy(p,{...opts, x:guyX, y:GROUND-16+bob, sx, swing: flourish?Math.sin(now/120)*3:0});
  }
  drawFloating(now);
}
function renderDance(now,opts){

function sceneParty(now){

  for(let i=0;i<5;i++){ const c=cols[(i+Math.floor(now/300))%4]; ctx.fillStyle=c+'55'; ctx.beginPath(); ctx.moveTo(48,6); ctx.lineTo(i*24-10,96); ctx.lineTo(i*24+6,96); ctx.fill(); }
  disc(48,6,4,'#c8c8d8'); R(47,0,1,3,'#888');

}
function drawBike(bx,by,ang,c){
  const rot=(x,y)=>{ const ca=Math.cos(ang), sa=Math.sin(ang); return [bx+x*ca-y*sa, by+x*sa+y*ca]; };
  for(const wx of [-8,8]){ for(let i=0;i<16;i++){ const a=i/16*Math.PI*2; const q=rot(wx+Math.cos(a)*4, Math.sin(a)*4); R(q[0],q[1],1,1,'#222'); } }
  const b=rot(-8,0), s=rot(-2,-7), f=rot(8,0), h=rot(5,-9), pd=rot(0,-1);
  line(b[0],b[1],s[0],s[1],1,c); line(s[0],s[1],h[0],h[1],1,c); line(h[0],h[1],f[0],f[1],1,c); line(b[0],b[1],pd[0],pd[1],1,c); line(pd[0],pd[1],s[0],s[1],1,c); line(pd[0],pd[1],h[0],h[1],1,c);
  const sea=rot(-3,-8); R(sea[0]-1,sea[1],3,1,'#222'); const hb=rot(6,-10); R(hb[0]-1,hb[1],3,1,'#222');
}
function sceneSlope(now){
  rect(0,0,W,96,'#9fdcff'); disc(80,12,5,'#ffe066');
  for(let i=0;i<3;i++){ const x=((i*45-now/60)%140+140)%140-20; for(let y=0;y<26;y++){ const h=Math.round(20*(y/26)); rect(Math.round(x-h),30+y,h*2+1,1,y<6?'#fff':'#8a96a8'); } }
  for(let x=0;x<W;x++){ const gy=Math.round(58+x*0.22); rect(x,gy,1,96-gy,'#6fbf5f'); R(x,gy,1,1,'#8b6a43'); }
  for(let i=0;i<4;i++){ const x=((i*30-now/25)%120+120)%120-10; const gy=58+x*0.22; rect(Math.round(x),Math.round(gy-8),2,8,'#6b4a2e'); disc(x+1,gy-10,4,'#3e8e41'); }
}
function renderBike(now,look){
  sceneSlope(now);
  const st=anim.state||'ride', bx=42, gy=58+bx*0.22, by=Math.round(gy-4);
  if(st==='wipe'){
    const e=(now-anim.stateT)/400;

    for(let i=0;i<4;i++){ const a=now/150+i*1.6; txt('*',bx+Math.cos(a)*10,by-24+Math.sin(a)*4,'#ffe066',8); }
  } else {
    const jump = st==='good' ? Math.round(Math.sin(Math.min(1,(now-anim.stateT)/800)*Math.PI)*8) : 0;
    drawBike(bx,by-jump,0.22,'#e2463f');
    drawGuy(POSES.bikeP,{...look, x:bx-2, y:by-10-jump, face: st==='good'?'o':'smile', dirty:false, swing:-4+Math.sin(now/90)*2});
  }
  if(anim.word) txt(anim.word,48,14,'#3b2340',8);
}
function renderSurf(now,look){
  sceneBeach(now);
  const waveY = 60 + Math.sin(now/500)*3;
  // ola grande
  for(let x=0;x<W;x++){ const h=Math.max(0,14-Math.abs(x-60)/3)+Math.sin(x/5+now/200)*1.5; rect(x,Math.round(waveY+8-h),1,Math.round(h+8),'#2589ad'); R(x,Math.round(waveY+8-h),1,1,'#e9fbff'); }
  const st = anim.state||'ride';

    rect(Math.round(bx-10+((now-anim.stateT)/30)),by+6,22,3,'#ffb347');
    drawGuy(POSES.wipe,{...look, x:bx, y:by-8, face:'o', dirty:false});

  } else {

function renderCuddle(now,look){

$('screen').addEventListener('pointerdown',e=>{
  if(e.target.closest && e.target.closest('.bubble')) return;
  if(game){ gameTap(); return; }
  if(S.mode==='over'){ showOver(); return; }
  if(anim) return;
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(S.floorGift && !S.sleeping && Math.abs(x-(S.floorGift.x+4))<9 && y>GROUND-16){ collectGift(); return; }
  if(S.mode==='wine'){ say(pick(WINE_LINES)); return; }
  if(S.sleeping){ say('zzz... cinco minutitos más... zzz'); return; }
  if(Math.abs(x-guyX)<12 && y>GROUND-46){
    const now=Date.now();
    floating.push({x:guyX-3,y:GROUND-40,t0:performance.now(),kind:'heart'});
    if(now-S.lastPat>20000){ S.stats.happy=clamp(S.stats.happy+3); S.lastPat=now; }
    beep(990,.05); say(pick(PAT_LINES),3500); updateBars(); return;
  }
});
function collectGift(){
  const g=S.floorGift; S.floorGift=null; S.gifts[g.type]=(S.gifts[g.type]||0)+1; addStars(1); jingle(true);
  if(g.type==='nota'){ const n=pick(NOTES); S.notes.push(n); if(S.notes.length>30) S.notes.shift(); modal(`<h2>💌 Una nota para ti</h2><p class="note">${n}</p><p style="text-align:right">— ${IS_M?'María':'el Bailarín'}</p><div class="opts"><button data-x>Guardar en mi colección</button></div>`); $('card').querySelector('[data-x]').onclick=closeModal; }
  else say(`¡Un regalo para ti, ${YOU}! ${GIFT_TYPES[g.type].e} (lo he guardado en tu colección)`);
  save();
}
function showStatus(){
  const s=S.stats, days=Math.floor((Date.now()-S.born)/86400000);
  const rows=BARS.map(([k,ic,n])=>`<span>${ic} ${n}</span><div class="tr"><div class="fi ${s[k]<25?'low':s[k]<50?'mid':''}" style="width:${s[k]}%;position:absolute;left:0;top:0;bottom:0"></div></div><span>${Math.round(s[k])}</span>`).join('');
  const gifts=Object.entries(GIFT_TYPES).map(([k,g])=>`<div><b>${g.e}</b>${g.n}: ${S.gifts[k]||0}</div>`).join('');

    'Bailarín, en el descanso te enseño a cantar el himno del bar.','Me hago amiga de la peña contraria en la primera parte. En la segunda, ya son de los nuestros.');
  Object.assign(NEED,{
    food:['Tengo hambre. Ponme algo... y una birra.','Me comería un bocata de lo que sea.'],
    energy:['Estoy reventada. Hasta el micro pesa.','Necesito dormir. Mañana hay bajada.'],
    clean:['Llevo barro hasta en las orejas.','Huelo a bici, a sudor y a aventura.'],
    happy:['Me aburro... ¿no hay nada peligroso que hacer?','Necesito una fiesta. O una cuesta. O las dos cosas.'],
    fit:['Llevo mucho sin bici. Me estoy oxidando.','Necesito adrenalina, Bailarín.'],
    anemic:['Estoy pálida... mi estado anémico pide que te acuestes conmigo. 🩸','Me falta hierro... y mimos.']});
  PAT_LINES.splice(0,PAT_LINES.length,'Jajaja, para, que me haces cosquillas.','¿Eso es un mimo o un placaje?','Ponme una birra y sigue.','Así sí, Bailarín.','¡Cuidado, que ahí tengo un moratón!');
  WINE_LINES.splice(0,WINE_LINES.length,'Bailarín... ponme otra birra... hic.','Esta birra está caliente, como mi corazón.','No puede ser bonito y seguro... ni sobrio.','¿Dónde está el micro? Quiero cantarle a las farolas.','Rescátame: ducha, comida y una bajada en bici. Por favor.');
  NOTES.splice(0,NOTES.length,'Bailarín, eres la única persona que baila peor de lo que yo canto. Te quiero.','Te debo una birra. Bueno, varias.','Gracias por cuidarme cuando me rompo cosas.','Si te caes, yo te levanto. Si me caigo yo, llama a urgencias.','Tú pones el baile, yo pongo el micro.','Contigo hasta las cuestas parecen bajadas.');
}
let nextLine=performance.now()+8000;
function chatter(now){
  if(now<nextLine || anim || game || S.mode==='over' || S.sleeping || $('modal').classList.contains('show')) return;
  nextLine = now + 22000 + Math.random()*16000;
  if(S.mode==='wine'){ say(pick(WINE_LINES)); return; }
  const low = BARS.filter(([k])=>S.stats[k]<30).map(b=>b[0]);
  if(low.length && Math.random()<.6){ say(pick(NEED[pick(low)])); return; }
  if(IS_M && S.injuredUntil>Date.now() && Math.random()<.3){ say(pick(['Con la escayola también se puede montar en bici. Creo.','Esto no es nada. La próxima vez me rompo algo más gordo.','¿Me firmas la escayola, Bailarín?'])); return; }
  if(Date.now()-S.lastTrip>20*60000 && S.stats.energy>=15 && Math.random()<(Object.keys(S.trips).length?0.3:0.5)){ proposeTrip(); return; }
  say(pick(LINES), 7000);
}

// ====================== BUCLE ======================
let lastFrame=performance.now(), simAcc=0, saveAcc=0, uiAcc=0;
function loop(now){
  const dt=Math.min(0.1,(now-lastFrame)/1000); lastFrame=now;
  simAcc+=dt; saveAcc+=dt; uiAcc+=dt;
  if(simAcc>=1){
    const before=S.mode, wasSleeping=S.sleeping;
    step(simAcc/3600); simAcc=0;
    if(before!==S.mode){ anim=null; game=null; $('game').classList.remove('show');
      if(S.mode==='wine') say(IS_M?'Me he ido de after... a la calle... con una birra. 🍺 Rescátame, Bailarín.':'Me he ido... a la calle... con un cartón de vino. 🍷 Rescátame, María.',8000);
      if(S.mode==='over') showOver(); }
    if(wasSleeping && !S.sleeping) say(IS_M?'¡Buenos días! ¿Qué deporte de riesgo toca hoy?':'¡Buenos días! He soñado que bailaba en el mar.');
  }
  if(uiAcc>=0.5){ uiAcc=0; updateBars(); }
  if(saveAcc>=5){ saveAcc=0; save(); }
  tickGame(dt); chatter(now);
  render(now);
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else { // al volver, ponerse al día
  let hours=Math.min((Date.now()-S.last)/3600000,24*30); const before=S.mode;
  while(hours>0 && S.mode!=='over'){ const d=Math.min(1/60,hours); step(d); hours-=d; } S.last=Date.now();
  if(before!==S.mode){ anim=null; game=null; $('game').classList.remove('show'); if(S.mode==='over') showOver(); }
  updateBars(); }});
window.addEventListener('pagehide',save);

ensureWardrobe(); $('stars').textContent='⭐ '+S.stars;

$('swap').textContent = IS_M ? '🩰 Cambiar al Bailarín' : '🚵‍♀️ Cambiar a María';

if(IS_M){ document.querySelector('h1').textContent='MARÍA'; document.querySelector('.foot').textContent='Toca a María para darle mimos · se guarda sola'; document.querySelector('[data-a=surf]').innerHTML='<span class="e">🚵</span>Bici'; document.querySelector('[data-a=dance]').innerHTML='<span class="e">🎤</span>Micro'; }
updateBars(); save();
if(!CAN_SAVE){ const r=$('rescue'); setTimeout(()=>{ say('⚠️ Este navegador no me deja guardar la partida. Ábreme en Safari y añádeme a la pantalla de inicio.',12000); },1500); }
if(SELECTING){ showSelector(); }
else if(S.mode==='over') showOver();
else if(!S.introSeen && IS_M){
  modal(`<h2>¡Hola, Bailarín! 👋</h2><p>Te presento a <b>María</b>: 1,61 m de pura energía, media melena negra y adicta al deporte de riesgo. De vez en cuando se rompe algo hostiándose con la bici. Bebe Voll-Damm y en las fiestas no suelta el micro.</p>

  <div class="opts"><button data-x>La cuidaré 💖</button><button data-h>¿Cómo se juega?</button></div>`);
  $('card').querySelector('[data-x]').onclick=()=>{ S.introSeen=true; save(); closeModal(); say('Hola, Bailarín. Soy María. Ponme una birra y hablamos.',6000); };
  $('card').querySelector('[data-h]').onclick=()=>{ S.introSeen=true; save(); ACTIONS.help(); };
}
else if(!S.introSeen){
  modal(`<h2>¡Hola, María! 👋</h2><p>Te presento al <b>Bailarín</b>: pelo largo, rubio, ojos claros, de Valladolid pero vive en Santoña. Surfero y bailarín contemporáneo muy, muy intenso.</p>
  <p>Ahora es tu responsabilidad. Dale de comer, llévalo a surfear y a bailar, dúchalo y dale mucho cariño.</p>
  <p>Si lo descuidas... acabará <b>bebiendo vino en la calle</b>. Y si no le das amor... <b>se abrirá un Tinder</b>.</p>
  <div class="opts"><button data-x>Lo cuidaré 💖</button><button data-h>¿Cómo se juega?</button></div>`);
  $('card').querySelector('[data-x]').onclick=()=>{ S.introSeen=true; save(); closeModal(); say('Hola, María. Soy el Bailarín. Hoy me siento muy... contemporáneo.',6000); };
  $('card').querySelector('[data-h]').onclick=()=>{ S.introSeen=true; save(); ACTIONS.help(); };
} else if(S.welcome==='wine'){ say(IS_M?'Mientras no estabas... me fui de after con una birra. 🍺 Rescátame.':'Mientras no estabas... me fui a la calle con un cartón de vino. 🍷 Rescátame.',8000); }
else setTimeout(()=>say(pick(IS_M?['¡Bailarín! Por fin. Ponme una birra y te cuento.','¡Hola! ¿Hoy qué nos jugamos el cuello?','¡Has vuelto! Tenía un plan arriesgadísimo para ti.']:['¡María! Has vuelto. Te he echado de menos en espiral.','¡Hola! Llevaba un rato haciendo pliés esperándote.','¡Por fin! Tenía una pieza preparada para ti.'])),800);
requestAnimationFrame(loop);
