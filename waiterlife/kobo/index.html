 * Schedule out an AES key for both encryption and decryption.  This

 *
 * @constructor

    this._precompute();

    encKey, decKey,
    sbox = this._tables[0][4], decTable = this._tables[1],

 * @namespace

 * possibly-changing manner) to encode the number of bits actually  present
