    kSize = KSIZES[n];
    lsSet("wl-kobo-size", String(kSize));
    kApplySize();
    resize();
  }
  function resize() {
    kApplySize();
    _orig_resize();
    var el = document.getElementById("kdyn");
    if (!el) {
      el = document.createElement("style");
      el.id = "kdyn";
      document.head.appendChild(el);
    }
    var h = KSCH + 3;
    el.textContent = "#pop,.drop,#chat{top:" + h + "px!important;left:0!important;bottom:0;max-height:none}#tabs{top:" + h + "px}";
    kRedraw(100);
  }
  var KCURVE = function () {
    var c = new Uint8Array(256);
    for (var v = 0; v < 256; v++) {
      var y = Math.pow(v / 255, 0.62);
      y = (y - 0.5) * 1.35 + 0.56;
      y = Math.max(0, Math.min(1, y));
      c[v] = Math.round(Math.round(y * 15) * 17);
    }
    return c;
  }();
  function kInk() {
    var w = cv.width,
      h = cv.height;
    if (!w || !h) return;
    var im = ctx.getImageData(0, 0, w, h),
      d = im.data;
    for (var n = 0; n < d.length; n += 4) {
      var v = KCURVE[d[n] * 77 + d[n + 1] * 150 + d[n + 2] * 29 >> 8];
      d[n] = d[n + 1] = d[n + 2] = v;
      d[n + 3] = 255;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(im, 0, 0);
  }
  (function () {
    var b = $("#bMore"),
      old = b.onclick;
    b.onclick = function (e) {
      old(e);
      if (!openDrop) return;
      var box = openDrop;
      var sz = item(box, null, "\uD83D\uDD20 Tama\xF1o de letra", "Ahora: " + (kSize || kAutoSize()) + " px", null);
      sz.onclick = null;
      sz.appendChild(miniBtn("A\u2212", function () {
        kStepSize(-1);
        closeDrop();
      }));
      sz.appendChild(miniBtn("A+", function () {
        kStepSize(1);
        closeDrop();
      }));
      item(box, null, "\uD83D\uDD04 Actualizar ahora", "La pantalla se refresca sola cada 15 s", function () {
        closeDrop();
        openStream();
        kRedraw(50);
      });
      item(box, null, "\uD83D\uDCF1 Versi\xF3n normal", "La de m\xF3vil, con animaciones", function () {
        location.href = "../" + location.hash;
      });
    };
  })();
  setTimeout(function () {
    buildStatic();
    kRedraw(50);
  }, 2500);
  setTimeout(function () {
    buildStatic();
    kRedraw(50);
  }, 8e3);
  resize();
  kRedraw(300);
  window.__kstep = "en marcha";
})();
</script>
