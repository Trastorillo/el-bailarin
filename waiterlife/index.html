<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WaiterLife">
<meta name="theme-color" content="#1b1026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>WaiterLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1026;--panel:#2a1a3a;--panel2:#3d2756;--ink:#fff3e0;--dim:#c9b6d8;--acc:#ff5fa2;--acc2:#3ee6c4;--gold:#ffd23f;--line:#0e0714}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'VT323',ui-monospace,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;gap:6px;align-items:center;padding:5px 8px;background:linear-gradient(#3a2250,#2a1a3a);border-bottom:3px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#top::-webkit-scrollbar{display:none}
.logo{font-size:24px;color:var(--gold);text-shadow:2px 2px 0 #b3236b;white-space:nowrap;margin-right:4px;letter-spacing:1px}
.btn{font:inherit;font-size:20px;line-height:1.1;color:var(--ink);background:var(--panel2);border:2px solid var(--line);box-shadow:inset -2px -3px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.18);padding:3px 10px 4px;border-radius:0;white-space:nowrap;cursor:pointer}
.btn:active,.btn.on{transform:translateY(1px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.4)}
.btn.pri{background:#c23c7a}.btn.ok{background:#1f8f78}.btn.warn{background:#a8432a}.btn.gold{background:#b8861b}
.btn:disabled{opacity:.45}
.sp{flex:1}
#status{display:flex;align-items:center;gap:5px;font-size:17px;color:var(--dim);white-space:nowrap}
#status i{width:10px;height:10px;display:inline-block;background:#f0a030;box-shadow:0 0 6px #f0a030}
#status.live i{background:#3ee66a;box-shadow:0 0 6px #3ee66a}
#status.off i{background:#ff4a4a;box-shadow:0 0 6px #ff4a4a}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#140b1d}
#scene{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.drop{position:absolute;z-index:30;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.5);min-width:230px;max-width:min(360px,92vw);max-height:calc(100% - 12px);overflow:auto}
.drop h4{margin:0;padding:6px 10px;font-weight:normal;font-size:18px;color:var(--gold);background:#22142f;position:sticky;top:0}
.it{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:20px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}
.it:active{background:#4a3066}
.it canvas{width:28px;height:28px;image-rendering:pixelated;flex:none;background:#1e1229}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sub{font-size:16px;color:var(--dim)}
.it .mini{font:inherit;font-size:16px;padding:1px 6px}
.empty{padding:10px;color:var(--dim);font-size:18px}
#pop{position:absolute;z-index:25;width:min(300px,94vw);background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.5);max-height:calc(100% - 8px);overflow:auto;display:none}
#pop .hd{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#22142f}
#pop .hd canvas{width:30px;height:30px;image-rendering:pixelated}
#pop .hd .nm{font-size:22px;color:var(--gold);line-height:1}
#pop .hd .st{font-size:15px;color:var(--dim);line-height:1.1}
#pop .x{margin-left:auto}
#pop .sec{padding:4px 8px}
#pop .lbl{font-size:15px;color:var(--dim);margin:2px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid .btn{font-size:16px;padding:2px 3px;overflow:hidden;text-overflow:ellipsis}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pay .btn{font-size:18px;opacity:.55}
.pay .btn.sel{opacity:1;outline:2px solid var(--gold)}
.hist{font-size:16px;color:var(--dim);max-height:66px;overflow:auto}
.hist div{display:flex;gap:6px;align-items:center}
.hist button{font:inherit;background:none;border:0;color:#ff8a8a;font-size:16px;padding:0 4px;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,4,16,.78);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.5);max-width:760px;width:100%;max-height:100%;overflow:auto;padding:10px 12px}
.card h3{margin:0 0 6px;font-weight:normal;font-size:26px;color:var(--gold)}
.card p{font-size:19px;margin:4px 0;color:var(--ink)}
.ed{display:flex;gap:12px;align-items:flex-start}
.ed .pv{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:0}
.ed .pv canvas{width:120px;height:180px;image-rendering:pixelated;background:radial-gradient(#4a2f66,#22142f);border:2px solid var(--line)}
.ed .opts{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:19px}
.row .k{width:108px;flex:none;color:var(--dim)}
.row .v{flex:1;text-align:center;background:#1e1229;border:2px solid var(--line);padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .btn{padding:1px 9px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle;margin-right:4px}
input,select{font:inherit;font-size:19px;color:var(--ink);background:#1e1229;border:2px solid var(--line);padding:3px 6px;border-radius:0;min-width:0}
input{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:flex-end}
.who{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.who .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px}
.who canvas{width:56px;height:84px;image-rendering:pixelated}
#toasts{position:absolute;left:8px;bottom:8px;z-index:20;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60%}
.toast{background:rgba(34,20,47,.92);border:2px solid var(--line);padding:2px 8px;font-size:18px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#rot{display:none;position:fixed;inset:0;z-index:60;background:#1b1026;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:20px;gap:14px}
#rot .ph{font-size:64px;animation:spin 2s ease-in-out infinite}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:700px){body:not(.portrait-ok) #rot{display:flex}}
.hint{font-size:16px;color:var(--dim)}
#unread{display:none;margin-left:5px;background:#ff3b5c;color:#fff;font-weight:normal;padding:0 5px;font-size:16px}
#unread.on{display:inline-block}
#bDuty.duty{background:#1f8f78}
#chat{position:absolute;top:0;right:0;bottom:0;z-index:28;width:min(340px,62vw);background:var(--panel);border-left:3px solid var(--line);box-shadow:-4px 0 0 rgba(0,0,0,.4);display:none;flex-direction:column}
#chat.on{display:flex}
#chat .ch{display:flex;align-items:center;padding:4px 8px;background:#22142f;color:var(--gold);font-size:20px}
#chat .ch .btn{margin-left:auto;padding:0 8px}
#msgs{flex:1;overflow:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:18px;line-height:1.05}
.msg canvas{width:24px;height:24px;image-rendering:pixelated;flex:none;background:#1e1229}
.msg .w{color:#9fffe9;font-size:15px}
.msg.mine .w{color:var(--gold)}
.msg .tx{word-break:break-word;-webkit-user-select:text;user-select:text}
#chat form{display:flex;gap:4px;padding:5px;border-top:2px solid var(--line)}
.sumf{width:22px;height:22px;image-rendering:pixelated;flex:none}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="logo">WaiterLife</span>
    <button class="btn pri" id="bArrive">🚶 Llega… ▾</button>
    <button class="btn" id="bLeave">👋 Se va… ▾</button>
    <button class="btn ok" id="bNew">➕ Cliente</button>
    <button class="btn" id="bClients">📇 Clientes</button>
    <button class="btn gold" id="bMe">🧑‍🍳 Yo</button>
    <button class="btn" id="bDuty">🏠 En casa</button>
    <button class="btn" id="bBar">📋 Bar</button>
    <button class="btn" id="bChat">💬 Chat<b id="unread"></b></button>
    <button class="btn" id="bMore">⋯</button>
    <span class="sp"></span>
    <span id="status"><i></i><span>conectando…</span></span>
  </div>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="pop"></div>
    <div id="toasts"></div>
    <div id="chat"><div class="ch">💬 Chat de camareros<button class="btn" id="chatX">✕</button></div><div id="msgs"></div>
      <form id="chatF"><input id="chatIn" maxlength="200" placeholder="Escribe a los demás…" autocomplete="off"><button class="btn ok">Enviar</button></form></div>
  </div>
</div>
<div id="rot"><div class="ph">📱</div><div>Gira el móvil para ver el bar en grande</div><button class="btn" onclick="document.body.classList.add('portrait-ok');resize()">Seguir así</button></div>

<script>
'use strict';
// ====================== CONFIG ======================
const TOPIC = 'waiterlife-bar-h3k9q2v7xm';   // canal compartido de los 3 camareros
const NTFY = 'https://ntfy.sh/';
const LSKEY = 'waiterlife-v1';
const REPUBLISH_AGE = 6*3600e3;   // ntfy guarda 12 h: lo que tenga más de 6 h se vuelve a enviar
const MAX_WAITERS = 3;

const $ = s => document.querySelector(s);
const rid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ====================== CATÁLOGO DE ASPECTO ======================
const SKINS = [['Muy clara','#ffe3cc'],['Clara','#f6c9a0'],['Media','#e0a878'],['Morena','#b97a4e'],['Oscura','#7d4a2a'],['Muy oscura','#55301b']];
const HAIRC = [['Negro','#1f1a26'],['Castaño','#5a3420'],['Rubio','#f2cf63'],['Pelirrojo','#c4511f'],['Canoso','#b9b9c4'],['Rosa','#ff7ab8'],['Azul','#4f7dff'],['Verde','#3fbf6a'],['Platino','#f4f1ea']];
const HAIRS = ['Calvo','Rapado','Corto','Flequillo','Cresta','Largo','Coleta','Moño','Rizos','Media melena','Tupé'];
const EYES = ['Normales','Grandes','Felices','Pestañas','Gafas','Gafas de sol','Cejas pobladas'];
const MOUTHS = ['Sonrisa','Seria','Sorpresa','Pícara','Dientes'];
const FACIAL = ['Nada','Bigote','Barba','Perilla','Barba de 3 días'];
const TOPS = ['Camiseta','Camisa','Sudadera','Tirantes','Chaqueta','Rayas','Vestido','Hawaiana'];
const COLORS = [['Blanco','#f2f2f2'],['Negro','#2a2630'],['Rojo','#d23b3b'],['Azul','#3a6fd8'],['Celeste','#7fd3f7'],['Verde','#3fa860'],['Amarillo','#f4c534'],['Rosa','#f27fb2'],['Morado','#8a55c9'],['Naranja','#f08a2c'],['Gris','#8d8d99'],['Marrón','#7a4b2a'],['Vaquero','#3d5a8a'],['Caqui','#8a8a4a']];
const BOTTOMS = ['Pantalón','Pantalón corto','Falda','Chándal'];
const ACCS = ['Nada','Gorra','Gorro de lana','Pendientes','Collar','Pajarita','Delantal','Auriculares','Bandana'];
const FIELDS = [
  ['sk','Piel',SKINS,1],['hs','Peinado',HAIRS],['hc','Color pelo',HAIRC,1],['ey','Ojos',EYES],['mo','Boca',MOUTHS],
  ['fh','Vello facial',FACIAL],['tp','Ropa arriba',TOPS],['tc','Color arriba',COLORS,1],['bt','Ropa abajo',BOTTOMS],
  ['bc','Color abajo',COLORS,1],['ac','Complemento',ACCS]];
function randAvatar(){const a={};for(const [k,,list] of FIELDS)a[k]=Math.floor(Math.random()*list.length);
  if(Math.random()<.6)a.fh=0; if(Math.random()<.5)a.ac=0; if(Math.random()<.6)a.ey=Math.floor(Math.random()*3); return a}

// ====================== BEBIDAS ======================
const DRINKS = {
  cerveza:{e:'🍺',n:'Cerveza',u:1},
  vino:{e:'🍷',n:'Vino',u:1},
  cubata:{e:'🍹',n:'Cubata',u:2},
  licor:{e:'🥃',n:'Licor',u:1.5},
  refresco:{e:'🥤',n:'Refresco',u:0},
  cafe:{e:'☕',n:'Café',u:0}};
const DRINK_KEYS = Object.keys(DRINKS);
const LEVELS = ['Fresco','Contentillo','Alegre','Piripi','Pedo','K.O.'];
const BURN_MS = 2.5*3600e3; // cada consumición deja de contar a las 2,5 h

// ====================== DATOS (local + ntfy) ======================
let DB = (()=>{try{const d=JSON.parse(lsGet(LSKEY));if(d&&d.recs)return d}catch(e){} return {recs:{},me:null,pending:[]}})();
if(!DB.pending)DB.pending=[];
let CLIENT = lsGet('wl-client'); if(!CLIENT){CLIENT=rid();lsSet('wl-client',CLIENT)}
let saveT=null; function save(){clearTimeout(saveT);saveT=setTimeout(()=>lsSet(LSKEY,JSON.stringify(DB)),250)}
const rec = k => {const r=DB.recs[k];return r?r.v:null};
let uiDirty = true;
function apply(k,v,t,c){
  const r=DB.recs[k];
  if(r && (r.t>t || (r.t===t && (r.c||'')>=(c||'')))) return false;
  DB.recs[k]={v,t,c}; uiDirty=true; save(); return true;
}
function put(k,v,m){
  const prev=DB.recs[k]; const t=Math.max(Date.now(), prev?prev.t+1:0);
  apply(k,v,t,CLIENT); send({k,v,t,c:CLIENT,m:m||undefined}); refreshUI();
}
function send(msg){DB.pending.push(msg);save();flush()}
let flushing=false, flushTimer=null, backoff=4000;
async function flush(){
  if(flushing||!DB.pending.length)return; flushing=true;
  try{
    while(DB.pending.length){
      const msg=DB.pending[0];
      const res=await fetch(NTFY+TOPIC,{method:'POST',body:JSON.stringify(msg)});
      if(!res.ok) throw new Error('http '+res.status);
      DB.pending.shift(); save(); backoff=4000;
    }
  }catch(e){
    clearTimeout(flushTimer); flushTimer=setTimeout(flush,backoff); backoff=Math.min(backoff*2,60000);
    if(!navigator.onLine) setStatus('off');
  }finally{flushing=false}
}
const seen = {};            // clave -> última vez que la vimos en ntfy (ms)
let lastId = null, synced=false, es=null, esTimer=null;
function handleNtfy(o, live){
  if(!o||o.event!=='message')return;
  if(o.id)lastId=o.id;
  let m; try{m=JSON.parse(o.message)}catch(e){return}
  if(!m||typeof m.k!=='string'||typeof m.t!=='number'||m.k.length>120)return;
  if(m.v!==null && typeof m.v!=='object')return;
  seen[m.k]=Math.max(seen[m.k]||0,(o.time||0)*1000);
  const changed=apply(m.k,m.v,m.t,m.c);
  if(changed && live && m.c!==CLIENT) onRemote(m);
  if(changed) refreshUI();
}
async function initialSync(){
  setStatus('sync');
  try{
    const res=await fetch(NTFY+TOPIC+'/json?poll=1&since=12h');
    if(!res.ok)throw new Error('http '+res.status);
    const txt=await res.text();
    for(const line of txt.split('\n')){if(!line.trim())continue;try{handleNtfy(JSON.parse(line),false)}catch(e){}}
    synced=true; refreshUI(); openStream(); flush(); heartbeat(true);
    setTimeout(republish, 3000+Math.random()*9000);
    setInterval(republish, 45*60e3);
  }catch(e){
    setStatus('off'); setTimeout(initialSync, 8000);
  }
}
function openStream(){
  clearTimeout(esTimer); if(es){try{es.close()}catch(e){}}
  es=new EventSource(NTFY+TOPIC+'/sse'+(lastId?'?since='+encodeURIComponent(lastId):''));
  es.onopen=()=>setStatus('live');
  es.onmessage=e=>{try{handleNtfy(JSON.parse(e.data),true)}catch(_){}};
  es.onerror=()=>{setStatus(navigator.onLine?'sync':'off');try{es.close()}catch(_){};es=null;esTimer=setTimeout(openStream,5000)};
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(synced)openStream();else initialSync();flush();tickClock()}});
window.addEventListener('online',()=>{flush();if(synced)openStream()});
function prunable(k,r){
  const now=Date.now();
  if(r.v===null) return now-r.t>7*86400e3;
  if(k.startsWith('m:')) return now-r.t>3*86400e3;
  if(k.startsWith('d:')){const [,cid,at]=k.split(':');const b=rec('b:'+cid);return !(b&&b.on&&String(b.at)===at) && now-r.t>36*3600e3}
  return false;
}
function republish(){
  const now=Date.now(); let n=0;
  for(const k of Object.keys(DB.recs)){
    const r=DB.recs[k];
    if(prunable(k,r)){delete DB.recs[k];continue}
    if(k.startsWith('m:')) continue;
    if((seen[k]||0) > now-REPUBLISH_AGE) continue;
    if(DB.pending.some(p=>p.k===k)) continue;
    if(n++>80)break;
    seen[k]=now; DB.pending.push({k,v:r.v,t:r.t,c:r.c});
  }
  save(); flush();
}
function setStatus(s){const el=$('#status');el.className=s==='live'?'live':s==='off'?'off':'';el.lastChild.textContent=s==='live'?'en vivo':s==='off'?'sin conexión':'conectando…'}

// ====================== CONSULTAS ======================
const customers = () => Object.keys(DB.recs).filter(k=>k.startsWith('c:')&&rec(k)).map(k=>({id:k.slice(2),...rec(k)})).sort((a,b)=>a.n.localeCompare(b.n,'es'));
const waiters = () => Object.keys(DB.recs).filter(k=>k.startsWith('w:')&&rec(k)).map(k=>({id:k.slice(2),...rec(k)})).sort((a,b)=>(a.ct||0)-(b.ct||0));
const cust = id => rec('c:'+id);
const visit = id => {const b=rec('b:'+id);return b&&b.on&&cust(id)?b:null};
const inBar = () => customers().filter(c=>visit(c.id));
function drinksOf(id){
  const b=visit(id); if(!b)return [];
  const pre='d:'+id+':'+b.at+':';
  return Object.keys(DB.recs).filter(k=>k.startsWith(pre)&&rec(k)).map(k=>({k,...rec(k)})).sort((a,b)=>a.t-b.t);
}
function drunkLevel(id){
  const now=Date.now(); let u=0;
  for(const d of drinksOf(id)){const D=DRINKS[d.ty];if(!D)continue;u+=D.u*Math.max(0,1-(now-d.t)/BURN_MS)}
  return u<0.6?0:u<1.6?1:u<3?2:u<4.5?3:u<6?4:5;
}
const me = () => DB.me ? rec('w:'+DB.me) : null;
const pres = id => rec('p:'+id);
const onDuty = id => {const p=pres(id);return !!(p&&p.d&&Date.now()-p.s<14*3600e3)};
const atHomeOnline = id => {const p=pres(id);return !!(p&&!p.d&&Date.now()-p.s<12*60e3)};
const chatMsgs = () => Object.keys(DB.recs).filter(k=>k.startsWith('m:')&&rec(k)).map(k=>rec(k)).sort((a,b)=>a.t-b.t).slice(-80);
const VSPOTS=[[0.9,9.6],[3.4,9.6],[6.9,6.15]];
let lastBeat=0;
function heartbeat(force){
  if(!DB.me||!me())return; if(!force&&(document.visibilityState!=='visible'||Date.now()-lastBeat<4*60e3))return;
  lastBeat=Date.now(); const p=pres(DB.me)||{}; put('p:'+DB.me,{d:p.d?1:0,s:Date.now()});
}
function setDuty(d){if(!me())return chooseWaiter();lastBeat=Date.now();put('p:'+DB.me,{d:d?1:0,s:Date.now()},d?`${myName()} entra de servicio`:`${myName()} se va a casa`);updateDutyBtn()}
function updateDutyBtn(){const b=$('#bDuty');const d=DB.me&&onDuty(DB.me);b.textContent=d?'🟢 De servicio':'🏠 En casa';b.classList.toggle('duty',!!d)}
const myName = () => (me()||{}).n || 'Alguien';

// ====================== ESCENA ======================
const cv=$('#scene'), ctx=cv.getContext('2d');
const NW=400; let NH=180, K=3, SC=2, OX=200, OY=56;
const WALL=52, C=11, R=12;
let stat=document.createElement('canvas'), sctx=stat.getContext('2d');
const P=(i,j,z=0)=>[OX+(i-j)*16, OY+(i+j)*8-z];
function poly(g,pts,fill){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let n=1;n<pts.length;n++)g.lineTo(pts[n][0],pts[n][1]);g.closePath();g.fillStyle=fill;g.fill()}
function isoBox(g,i0,j0,i1,j1,z0,h,top,left,right){
  const z1=z0+h;
  poly(g,[P(i0,j1,z0),P(i1,j1,z0),P(i1,j1,z1),P(i0,j1,z1)],left);
  poly(g,[P(i1,j0,z0),P(i1,j1,z0),P(i1,j1,z1),P(i1,j0,z1)],right);
  poly(g,[P(i0,j0,z1),P(i1,j0,z1),P(i1,j1,z1),P(i0,j1,z1)],top);
}
const rq=(g,i0,i1,z0,z1,c)=>poly(g,[P(i0,0,z0),P(i1,0,z0),P(i1,0,z1),P(i0,0,z1)],c);
const lq=(g,j0,j1,z0,z1,c)=>poly(g,[P(0,j0,z0),P(0,j1,z0),P(0,j1,z1),P(0,j0,z1)],c);
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(f<0?v*(1+f):v+(255-v)*f)));return '#'+((1<<24)|(m(r)<<16)|(m(g)<<8)|m(b)).toString(16).slice(1)}

function wallText(g,txt,i0,ztop,px,color,glow){
  const [bx,by]=P(i0,0,ztop); g.save(); g.fillStyle=color; if(glow){g.shadowColor=glow;g.shadowBlur=5*K}
  let u=0;
  for(const ch of txt){const f=FONT[ch];if(f){for(let n=0;n<15;n++)if(f[n]==='1'){const x=n%3,y=(n/3|0);const ux=u+x*px;g.fillRect(Math.round(bx+ux),Math.round(by+ux*0.5+y*px),px,px)}}u+=4*px}
  g.restore();
}

  if(s1==='#141a4a'){for(const [j,z] of [[3.9,33],[4.4,30],[4.6,34],[4.1,27]]){const [x,y]=P(0,j,z);g.fillStyle='#fff';g.fillRect(Math.round(x),Math.round(y),1,1)}}

  // pizarra con las bebidas y diana

    ['HOY:','Caña 2€','Vino 2,5€','Cubata 6€','Café 1,3€'].forEach((t,n)=>g.fillText(t,0,n*3.2)); g.restore(); }
  { const [x,y]=P(0,7.7,27); const X=Math.round(x),Y=Math.round(y);

    g.fillStyle='#ffd23f';g.fillRect(X+1,Y-2,4,1); }
  // póster
  lq(g,8.1,9.8,15,34,'#f2e2c4'); lq(g,8.25,9.65,17,32,'#e94f37'); lq(g,8.5,9.4,21,28,'#ffd23f');
  { const [x,y]=P(0,8.4,31.5);g.fillStyle='#fff';g.font='4px VT323,monospace';g.save();g.setTransform(K,-.5*K,0,K,x*K,y*K);g.fillText('MÚSICA EN VIVO',0,0);g.restore(); }
  // mueble trasero de la barra
  isoBox(g,1.6,0.05,8.8,0.75,0,13,'#5a3219','#3d2210','#2e190b');
  for(let i=2.2;i<8.4;i+=1.2){poly(g,[P(i,.75,2),P(i+.9,.75,2),P(i+.9,.75,11),P(i,.75,11)],'#4a2914')}
  // planta en la esquina
  { const [x,y]=P(.7,1.1); g.fillStyle='#8a4a2a';g.fillRect(Math.round(x)-4,Math.round(y)-7,8,7);g.fillStyle='#6a3520';g.fillRect(Math.round(x)-4,Math.round(y)-7,8,1);

    g.fillStyle='#4fbf6a';g.fillRect(Math.round(x)-1,Math.round(y)-21,2,8); }
}

// ---------- personaje pixel art ----------
function drawChar(g,a,fx,fy,o={}){
  a=a||{};
  const s=(SKINS[a.sk]||SKINS[1])[1], sd=shade(s,-.16);
  const hc=(HAIRC[a.hc]||HAIRC[0])[1], hd=shade(hc,-.3), hl=shade(hc,.25);
  const tc=(COLORS[a.tc]||COLORS[3])[1], td=shade(tc,-.25), tl=shade(tc,.2);
  const bc=(COLORS[a.bc]||COLORS[12])[1], bd=shade(bc,-.25);
  const X0=Math.round(fx)-7+(o.dx||0), Y0=Math.round(fy)-28;
  const r=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(X0+x,Y0+y,w,h)};
  const hs=a.hs|0, sit=!!o.sit, wf=o.walk|0;
  const dark='#1a1020', shoe='#2a2230';
  // sombra
  if(!o.noShadow){g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(X0+7,Y0+28,6,2.5,0,0,7);g.fill()}
  // pelo de detrás
  if(hs===5||hs===9){r(1,3,12,hs===5?13:8,hd)}
  if(hs===6){r(12,4,2,2,hc);r(12,6,2,7,hd)}
  // piernas
  if(a.bt===2||a.tp===6){ // falda / vestido: piernas de piel
    if(sit){r(4,22,3,3,s);r(7,22,3,3,s);r(3,24,4,2,shoe);r(7,24,4,2,shoe)}
    else{const l=wf===1?-1:0,rr=wf===3?-1:0;r(4,20,3,6+l,s);r(7,20,3,6+rr,s);r(3,26+l,4,2,shoe);r(7,26+rr,4,2,shoe)}
  } else {
    const lc=bc, sh=a.bt===1;
    if(sit){r(4,20,6,3,lc);r(4,22,3,2,sh?s:lc);r(7,22,3,2,sh?s:lc);r(3,24,4,2,shoe);r(7,24,4,2,shoe)}
    else{const l=wf===1?-1:0,rr=wf===3?-1:0;
      r(4,20,3,6+l,lc);r(7,20,3,6+rr,lc);r(7,20,1,4,bd);
      if(sh){r(4,23,3,3+l,s);r(7,23,3,3+rr,s)}
      if(a.bt===3){r(4,20,1,6+l,'#f2f2f2');r(9,20,1,6+rr,'#f2f2f2')}
      r(3,26+l,4,2,shoe);r(7,26+rr,4,2,shoe)}
  }
  if(a.bt===2&&a.tp!==6){r(3,19,8,4,bc);r(3,22,8,1,bd)}
  // torso y brazos
  const tp=a.tp|0, sleeve=tp===3?s:tc;
  r(3,12,8,8,tc); r(3,19,8,1,td);
  if(tp===6){r(3,19,8,5,tc);r(2,22,10,2,tc);r(2,23,10,1,td)}
  const sw=o.walk?(wf===1?1:wf===3?-1:0):0;
  r(1,12+sw,2,6,sleeve);r(11,12-sw,2,6,sleeve);r(1,18+sw,2,2,s);r(11,18-sw,2,2,s);
  if(tp===3){r(3,12,2,1,s);r(9,12,2,1,s)}
  if(tp===1){r(5,12,1,2,'#fff');r(8,12,1,2,'#fff');r(7,14,1,1,td);r(7,16,1,1,td);r(7,18,1,1,td)}
  if(tp===2){r(4,11,6,1,td);r(5,16,4,2,td);r(6,12,1,3,'#fff');r(8,12,1,3,'#fff')}
  if(tp===4){r(6,12,2,8,'#f2f2f2');r(5,12,1,8,td);r(8,12,1,8,td)}
  if(tp===5){for(const y of [13,15,17])r(3,y,8,1,tc==='#f2f2f2'?'#3a6fd8':'#f2f2f2')}
  if(tp===7){for(const [x,y] of [[4,13],[8,14],[5,16],[9,17],[4,18],[7,12]])r(x,y,1,1,tc==='#f4c534'?'#d23b3b':'#f4c534');r(4,15,1,1,'#3fa860');r(9,13,1,1,'#3fa860')}
  if(a.ac===6){r(4,14,6,9,'#f4f1ea');r(4,14,6,1,'#d8d2c4');r(3,12,1,3,'#f4f1ea');r(10,12,1,3,'#f4f1ea');r(6,17,2,2,'#d8d2c4')}
  // cuello y cabeza
  r(6,11,2,1,sd);
  r(3,2,8,9,s);r(2,3,10,7,s);r(1,5,1,2,s);r(12,5,1,2,s);r(4,10,6,1,sd);
  // ojos
  const ey=a.ey|0, lv=o.lv|0, blink=o.blink;
  if(lv>=4){for(const bx of [3,8]){r(bx,4,1,1,dark);r(bx+2,4,1,1,dark);r(bx+1,5,1,1,dark);r(bx,6,1,1,dark);r(bx+2,6,1,1,dark)}}
  else if(blink||ey===2||lv===3){r(3,6,1,1,dark);r(4,5,1,1,dark);r(5,6,1,1,dark);r(8,6,1,1,dark);r(9,5,1,1,dark);r(10,6,1,1,dark)}
  else if(ey===1){r(3,5,3,2,'#fff');r(8,5,3,2,'#fff');r(4,5,2,2,dark);r(9,5,2,2,dark);r(4,5,1,1,'#fff');r(9,5,1,1,'#fff')}
  else {r(4,5,1,2,dark);r(9,5,1,2,dark); if(lv===2){r(4,5,1,1,s);r(9,5,1,1,s)}}
  if(ey===3){r(3,4,1,1,dark);r(10,4,1,1,dark)}
  if(ey===6){r(3,3,3,1,hd);r(8,3,3,1,hd)}
  if(ey===4){for(const bx of [3,8]){r(bx,4,3,1,dark);r(bx,7,3,1,dark);r(bx,4,1,4,dark);r(bx+2,4,1,4,dark)}r(6,5,2,1,dark)}
  if(ey===5){r(3,5,3,2,'#111');r(8,5,3,2,'#111');r(6,5,2,1,'#111');r(3,5,1,1,'#555');r(8,5,1,1,'#555')}
  // mofletes de borrachera
  if(lv>=1){r(2,7,2,1,lv>=3?'#ff5f7a':'#ff9aa8');r(10,7,2,1,lv>=3?'#ff5f7a':'#ff9aa8')}
  if(lv>=4){r(3,8,8,1,'rgba(120,200,80,.35)')}

function bubble(g,x,y,text){

  if(cur)lines.push(cur); lines.length=Math.min(lines.length,3);
  const w=Math.ceil(Math.max(...lines.map(l=>g.measureText(l).width)))+6, h=lines.length*6+4;
  let bx=Math.round(x-w/2); bx=Math.max(2,Math.min(NW-w-2,bx)); const by=Math.max(1,Math.round(y-h-4));

const ANIM={}; const FX=[]; const SAY={}; const HITS=[];
function spotPos(s){const p=SPOTS[s]||SPOTS[0];return [p.i,p.j]}
function pathTo(from,to,leaving){
  const pts=[];
  if(leaving){if(from[0]<9)pts.push([from[0],LANE],[9.6,LANE]);pts.push(GATE,OUT)}
  else{if(from[0]>9.4)pts.push(GATE);if(to[0]<9){pts.push([9.6,LANE],[to[0],LANE])}pts.push(to)}
  return pts.map(p=>[p[0],p[1]]);
}
function syncAnim(){
  const now=Date.now(); const here=new Set();
  for(const c of inBar()){
    const b=visit(c.id); here.add(c.id); const sp=spotPos(b.s);
    let A=ANIM[c.id];
    if(!A||A.leaving){
      const fresh=now-b.at<20000;
      A=ANIM[c.id]= fresh ? {i:OUT[0],j:OUT[1],path:pathTo(OUT,sp),s:b.s} : {i:sp[0],j:sp[1],path:[],s:b.s};
    } else if(A.s!==b.s){A.s=b.s;A.path=pathTo([A.i,A.j],sp)}
  }
  for(const id of Object.keys(ANIM)){if(!here.has(id)&&!ANIM[id].leaving){const A=ANIM[id];A.leaving=true;A.path=pathTo([A.i,A.j],OUT,true)}}
}
function stepAnim(dt){
  for(const id of Object.keys(ANIM)){const A=ANIM[id];
    if(A.path.length){const [ti,tj]=A.path[0];const di=ti-A.i,dj=tj-A.j,d=Math.hypot(di,dj),sp=2.4*dt;
      if(d<=sp){A.i=ti;A.j=tj;A.path.shift()}else{A.i+=di/d*sp;A.j+=dj/d*sp}
      A.walkT=(A.walkT||0)+dt;
    }
    if(A.leaving&&!A.path.length)delete ANIM[id];
  }
}

let lastT=performance.now();
function frame(t){
  const dt=Math.min(.1,(t-lastT)/1000); lastT=t;
  if(uiDirty){syncAnim();uiDirty=false}
  stepAnim(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false; ctx.drawImage(stat,0,0);
  ctx.setTransform(K,0,0,K,0,0);
  const now=Date.now();
  HITS.length=0;
  // camareros detrás de la barra
  const all=waiters(), WPOS={};
  const ws=all.filter(w=>onDuty(w.id)).slice(0,MAX_WAITERS);
  const home=all.filter(w=>!onDuty(w.id)&&atHomeOnline(w.id));
  ws.forEach((w,n)=>{const i=WSLOTS[n];const [x,y]=P(i,2.15);WPOS[w.id]=[x,y-38];
    const bob=Math.sin(t/700+n*2)>0.6?1:0;
    drawChar(ctx,w.a,x,y-bob,{blink:Math.sin(t/900+n*3)>0.985,t});
    HITS.push({kind:'w',id:w.id,x0:x-8,y0:y-30,x1:x+8,y1:y-6});
    const mine=w.id===DB.me;
    nameTag(ctx,x,y-31,(mine?'★ ':'')+w.n,mine?'#ffd23f':'#9fffe9');
  });
  drawCounter(ctx,t);
  drawLamps(ctx,t);
  // objetos del salón ordenados por profundidad
  const L=[];
  SPOTS.forEach((s,n)=>{if(s.st)L.push({d:s.i+s.j-.02,f:()=>drawStool(ctx,s.i,s.j)})});
  TABLES.forEach(tb=>L.push({d:tb.i+tb.j,f:()=>drawTable(ctx,tb)}));
  L.push({d:2.0+0.85,f:()=>drawJukebox(ctx,t)});
  home.forEach((w,n)=>{const v=VSPOTS[n%VSPOTS.length];L.push({d:v[0]+v[1],f:()=>{
    const [x,y]=P(v[0],v[1]);drawChar(ctx,w.a,x,y,{t,blink:Math.sin(t/950+n)>0.985});
    HITS.push({kind:'w',id:w.id,x0:x-8,y0:y-32,x1:x+8,y1:y+2});WPOS[w.id]=[x,y-36];
    const mine=w.id===DB.me; nameTag(ctx,x,y-30,'🏠 '+w.n,mine?'#ffd23f':'#c9b6d8');}})});
  for(const id of Object.keys(ANIM)){const A=ANIM[id];const c=cust(id);if(!c)continue;
    L.push({d:A.i+A.j+.05,f:()=>{
      const walking=A.path.length>0;
      const sp=SPOTS[A.s]; const seated=!walking&&!A.leaving&&sp&&sp.st;
      const [x,y]=P(A.i,A.j,seated?8:0);
      const lv=drunkLevel(id);

      const ds=drinksOf(id); const last=ds[ds.length-1];

      ctx.globalAlpha=Math.max(0,Math.min(1,1-(A.i-C)/1.4));
      drawChar(ctx,c.a,x,y,{sit:seated,walk:walking?(Math.floor(A.walkT*8)%4):0,lv,dx:sway,drink,t,blink:Math.sin(t/1100+id.charCodeAt(0))>0.985});
      HITS.push({kind:'c',id,x0:x-9,y0:y-34,x1:x+9,y1:y+(seated?8:2)});
      const top=y-29-(c.a&&(c.a.hs===4||c.a.hs===7||c.a.hs===8||c.a.hs===10)?3:0);
      const endX=nameTag(ctx,x,top,c.n);
      const fb=lv>=3?Math.round(Math.sin(t/200)):0;
      drawFace(ctx,endX+2,top-8+fb,lv);
      if(lv>=5&&Math.floor(t/500)%2){ctx.fillStyle='#fff';ctx.font='6px VT323,monospace';ctx.fillText('z',endX+12,top-8)}

  for(const id in WPOS){const S=SAY['w:'+id];if(S&&S.until>now){const [x,y]=WPOS[id];bubble(ctx,x,y,S.text)}}
  for(let n=FX.length-1;n>=0;n--){const f=FX[n];const k=(now-f.t0)/1400;if(k>1){FX.splice(n,1);continue}
    const A=ANIM[f.id];if(!A)continue;const [x,y]=P(A.i,A.j,8);ctx.globalAlpha=1-k*k;ctx.font='9px serif';ctx.fillText(f.text,x+6,y-30-k*14);ctx.globalAlpha=1}
  // frases al azar
  if(Math.random()<dt*0.04){const list=inBar();if(list.length){const c=list[Math.floor(Math.random()*list.length)];const f=(c.f||[]).filter(Boolean);if(f.length&&!(SAY[c.id]&&SAY[c.id].until>now))say(c.id,f[Math.floor(Math.random()*f.length)])}}
  requestAnimationFrame(frame);

const chatOpen=()=>$('#chat').classList.contains('on');
function renderChat(){
  const list=chatMsgs(); const read=DB.chatRead||0;
  const un=list.filter(m=>m.t>read&&m.by!==DB.me).length;
  const b=$('#unread'); b.textContent=un; b.classList.toggle('on',un>0&&!chatOpen());
  if(!chatOpen())return;
  const box=$('#msgs'); box.innerHTML='';
  if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Aún no hay mensajes. Los mensajes solo los veis los camareros.';box.appendChild(e)}
  for(const m of list){const w=rec('w:'+m.by);const row=document.createElement('div');row.className='msg'+(m.by===DB.me?' mine':'');
    row.appendChild(headIcon(w?w.a:{}));const col=document.createElement('div');const h=document.createElement('div');h.className='w';h.textContent=(w?w.n:'¿?')+' · '+hm(m.t);
    const tx=document.createElement('div');tx.className='tx';tx.textContent=m.tx;col.appendChild(h);col.appendChild(tx);row.appendChild(col);box.appendChild(row)}
  box.scrollTop=box.scrollHeight;
  if(list.length){DB.chatRead=Math.max(read,list[list.length-1].t);save()}
}
$('#bChat').onclick=()=>{closeDrop();closePop();$('#chat').classList.toggle('on');renderChat();if(chatOpen()&&matchMedia('(pointer:fine)').matches)$('#chatIn').focus()};
$('#chatX').onclick=()=>{$('#chat').classList.remove('on');renderChat()};
$('#chatF').onsubmit=e=>{e.preventDefault();const i=$('#chatIn');const tx=i.value.trim();if(!tx)return;if(!me()){chooseWaiter();return}
  put('m:'+rid(),{by:DB.me,tx,t:Date.now()});say('w:'+DB.me,tx,7000);i.value='';renderChat()};
$('#bMore').onclick=e=>dropdown(e.currentTarget,'Más',d=>{
  item(d,null,'🧑‍🍳 Cambiar de camarero',null,()=>{closeDrop();chooseWaiter()});
  item(d,null,'🧹 Cerrar el bar',`Todos se van (${inBar().length} dentro)`,()=>{closeDrop();confirmBox('¿Cerrar el bar?','Todos los clientes que quedan saldrán del bar.','🧹 Cerrar',()=>{const l=inBar();l.forEach((c,n)=>leave(c.id,true));put('x:close',{t:Date.now()},myName()+' ha cerrado el bar');toast('Bar cerrado')})});
  item(d,null,'ℹ️ Cómo funciona',null,()=>{closeDrop();help()});
});
document.addEventListener('pointerdown',e=>{if(openDrop&&!openDrop.contains(e.target)&&!e.target.closest('#top'))closeDrop()});

function pickSpot(){
  const used=new Set(inBar().map(c=>visit(c.id).s));
  const free=SPOTS.map((s,n)=>n).filter(n=>!used.has(n));
  if(!free.length)return Math.floor(Math.random()*SPOTS.length);
  const stools=free.filter(n=>n<5), tables=free.filter(n=>n>=5&&n<13);
  const pool=stools.length&&Math.random()<.65?stools:tables.length?tables:free;
  return pool[Math.floor(Math.random()*pool.length)];
}
function arrive(id){
  const c=cust(id);if(!c||visit(id))return;
  put('b:'+id,{on:1,s:pickSpot(),at:Date.now()},`${myName()}: ha llegado ${c.n}`);
  setTimeout(()=>{const f=(c.f||[]).filter(Boolean);say(id,f.length?f[Math.floor(Math.random()*f.length)]:'¡Buenas!')},2600);
}
function leave(id,quiet){
  const c=cust(id),b=visit(id);if(!b)return;
  const ds=drinksOf(id),inv=ds.filter(d=>!d.p).length;
  put('b:'+id,{on:0,s:b.s,at:b.at,left:Date.now()},`${myName()}: ${c.n} se va (${ds.length} consumiciones${inv?', '+inv+' invitadas':''})`);
  if(!quiet)say(id,'¡Hasta luego!',2500);
  closePop();
}
function serve(id,ty,label){
  const b=visit(id),c=cust(id);if(!b)return;
  const paid=payMode(id); const D=DRINKS[ty];
  if(DB.me&&!onDuty(DB.me)){setDuty(1);toast('Ahora estás de servicio')}
  const lab=label||D.n;
  put('d:'+id+':'+b.at+':'+rid(),{ty,lab,p:paid?1:0,by:DB.me,t:Date.now()},`${myName()}: ${D.e} ${lab} para ${c.n}${paid?'':' (invitada)'}`);
  FX.push({id,text:'+'+D.e,t0:Date.now()});
  if(DB.me)say('w:'+DB.me,'¡Marchando!',2200);
  renderPop();
}
const PAY={}; function payMode(id){return PAY[id]!==false}

// ---------- menú del cliente ----------
let popId=null;
function closePop(){popId=null;$('#pop').style.display='none'}
function openPop(id){closeDrop();popId=id;renderPop();placePop()}
function placePop(){
  if(!popId)return; const A=ANIM[popId]; const p=$('#pop'); if(!A){closePop();return}
  const sr=$('#stage').getBoundingClientRect(), cr=cv.getBoundingClientRect();
  const [x,y]=P(A.i,A.j,8); const cx=cr.left-sr.left+x*SC, cy=cr.top-sr.top+y*SC;
  const w=p.offsetWidth, h=p.offsetHeight;
  let left=cx+28; if(left+w>sr.width-4)left=cx-28-w; left=Math.max(4,Math.min(sr.width-w-4,left));
  let top=cy-h/2-20; top=Math.max(4,Math.min(sr.height-h-4,top));
  p.style.left=left+'px';p.style.top=top+'px';
}
function renderPop(){
  if(!popId)return; const id=popId,c=cust(id),b=visit(id); const p=$('#pop');
  if(!c||!b){closePop();return}
  const ds=drinksOf(id), lv=drunkLevel(id), paidN=ds.filter(d=>d.p).length, invN=ds.length-paidN;
  const usual=(c.p||[]).filter(x=>x&&x[0]&&DRINKS[x[1]]);
  const mins=Math.max(0,Math.round((Date.now()-b.at)/60000));
  p.innerHTML=`<div class="hd"><canvas width="11" height="11" id="pf"></canvas><div><div class="nm">${esc(c.n)}</div>
    <div class="st">${LEVELS[lv]} · ${ds.length} consumiciones · lleva ${mins<60?mins+' min':Math.floor(mins/60)+' h '+(mins%60)+' min'}</div></div>
    <button class="btn x" data-a="close">✕</button></div>
  <div class="sec"><div class="pay"><button class="btn ${payMode(id)?'sel ok':''}" data-a="paid">💶 Paga</button><button class="btn ${!payMode(id)?'sel gold':''}" data-a="inv">🎁 Le invitan</button></div></div>
  ${usual.length?`<div class="sec"><div class="lbl">Lo de siempre</div><div class="grid">${usual.map((u,n)=>`<button class="btn pri" data-a="u" data-n="${n}">${DRINKS[u[1]].e} ${esc(u[0])}</button>`).join('')}</div></div>`:''}
  <div class="sec"><div class="lbl">Bebida</div><div class="grid">${DRINK_KEYS.map(k=>`<button class="btn" data-a="d" data-k="${k}">${DRINKS[k].e} ${DRINKS[k].n}</button>`).join('')}</div></div>
  ${ds.length?`<div class="sec"><div class="lbl">Cuenta: 💶 ${paidN} pagadas · 🎁 ${invN} invitadas</div><div class="hist">${ds.slice().reverse().map(d=>{const w=rec('w:'+d.by);const tm=new Date(d.t);return `<div>${(DRINKS[d.ty]||{}).e||''} ${esc(d.lab)} ${d.p?'💶':'🎁'} <span>${String(tm.getHours()).padStart(2,'0')}:${String(tm.getMinutes()).padStart(2,'0')}${w?' · '+esc(w.n):''}</span><button data-a="rm" data-k="${esc(d.k)}" title="Quitar">✕</button></div>`}).join('')}</div></div>`:''}
  <div class="sec"><div class="grid" style="margin-bottom:4px"><button class="btn" data-a="say">💬 Frase</button><button class="btn" data-a="edit">✏️ Editar</button><button class="btn warn" data-a="leave">👋 Se va</button></div></div>`;
  drawFace($('#pf').getContext('2d'),1,1,lv);
  p.style.display='block';
}
$('#pop').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!popId)return; const id=popId,c=cust(id),a=b.dataset.a;
  if(a==='close')closePop();
  else if(a==='paid'){PAY[id]=true;renderPop()}
  else if(a==='inv'){PAY[id]=false;renderPop()}
  else if(a==='d')serve(id,b.dataset.k);
  else if(a==='u'){const u=(c.p||[]).filter(x=>x&&x[0]&&DRINKS[x[1]])[+b.dataset.n];if(u)serve(id,u[1],u[0])}
  else if(a==='rm'){const k=b.dataset.k;const d=rec(k);if(d)put(k,null,`${myName()}: quita ${d.lab} a ${c.n}`);renderPop()}
  else if(a==='say'){const f=(c.f||[]).filter(Boolean);say(id,f.length?f[Math.floor(Math.random()*f.length)]:'...')}
  else if(a==='edit'){closePop();editCustomer(id)}
  else if(a==='leave')leave(id);
});

cv.addEventListener('click',e=>{
  if(openDrop){closeDrop();return}
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/SC, y=(e.clientY-r.top)/SC;
  for(let n=HITS.length-1;n>=0;n--){const h=HITS[n]; if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1){
    if(h.kind==='c'){if(popId===h.id)closePop();else openPop(h.id)}
    else {if(h.id===DB.me)editWaiter(h.id);else{const w=rec('w:'+h.id);say('w:'+h.id,['¡Ey!','¿Qué pasa?','Estoy a tope','Pásame un trapo'][Math.floor(Math.random()*4)],2200)}}
    return}}
  closePop();
});

// ---------- ventanas ----------
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="card">'+html+'</div>';document.body.appendChild(m);return m}
function confirmBox(title,text,okLabel,fn){
  const m=modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn warn" data-ok>${esc(okLabel)}</button></div>`);
  m.querySelector('[data-x]').onclick=()=>m.remove(); m.querySelector('[data-ok]').onclick=()=>{m.remove();fn()};
}
function avatarEditor(opts){
  // opts: {title, a, name, nameLabel, extra(html), onSave(a,name,root), onDelete}
  const a=Object.assign(randAvatar(),opts.a||{});
  const m=modal(`<h3>${esc(opts.title)}</h3><div class="ed"><div class="pv"><canvas width="20" height="30"></canvas><button class="btn" data-r>🎲 Al azar</button></div>
   <div class="opts"><div class="row"><span class="k">${esc(opts.nameLabel||'Nombre')}</span><input data-name maxlength="18" value="${esc(opts.name||'')}" placeholder="${esc(opts.namePh||'')}"></div>
   ${FIELDS.map(([k,lab])=>`<div class="row"><span class="k">${lab}</span><button class="btn" data-k="${k}" data-d="-1">◀</button><span class="v" data-v="${k}"></span><button class="btn" data-k="${k}" data-d="1">▶</button></div>`).join('')}
   ${opts.extra||''}
   <div class="acts">${opts.onDelete?'<button class="btn warn" data-del>🗑️ Borrar</button>':''}<span class="sp"></span><button class="btn" data-x>Cancelar</button><button class="btn ok" data-ok>💾 Guardar</button></div></div></div>`);
  const pv=m.querySelector('.pv canvas'), g=pv.getContext('2d');
  const paint=()=>{g.clearRect(0,0,20,30);drawChar(g,a,10,29,{});
    for(const [k,,list,isCol] of FIELDS){const v=m.querySelector(`[data-v="${k}"]`);const it=list[a[k]];v.innerHTML=isCol?`<span class="sw" style="background:${it[1]}"></span>${esc(it[0])}`:esc(it)}};
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;const list=FIELDS.find(f=>f[0]===k)[2];a[k]=(a[k]+(+b.dataset.d)+list.length)%list.length;paint()});
  m.querySelector('[data-r]').onclick=()=>{Object.assign(a,randAvatar());paint()};
  m.querySelector('[data-x]').onclick=()=>m.remove();
  m.querySelector('[data-ok]').onclick=()=>{const n=m.querySelector('[data-name]').value.trim();if(!n){m.querySelector('[data-name]').focus();m.querySelector('[data-name]').style.borderColor='#ff4a4a';return}
    if(opts.onSave(a,n,m)!==false)m.remove()};
  if(opts.onDelete)m.querySelector('[data-del]').onclick=()=>{confirmBox('¿Borrar?','Se borrará para todos los camareros.','🗑️ Borrar',()=>{opts.onDelete();m.remove()})};
  paint(); return m;
}
function editCustomer(id){
  const c=id?cust(id):null;
  const ph=['Cuando quieras','¡Otra ronda!'];
  const prods=(c&&c.p)||[['','cerveza'],['','cubata'],['','cafe']];
  const sel=v=>`<select>${DRINK_KEYS.map(k=>`<option value="${k}" ${k===v?'selected':''}>${DRINKS[k].e} ${DRINKS[k].n}</option>`).join('')}</select>`;
  const extra=`<div class="row"><span class="k">Frase 1</span><input data-f="0" maxlength="60" value="${esc(c&&c.f?c.f[0]:'')}" placeholder="${ph[0]}"></div>
   <div class="row"><span class="k">Frase 2</span><input data-f="1" maxlength="60" value="${esc(c&&c.f?c.f[1]:'')}" placeholder="${ph[1]}"></div>
   <p class="hint">Lo que suele pedir (aparece en su menú):</p>
   ${[0,1,2].map(n=>`<div class="row" data-p="${n}"><span class="k">Producto ${n+1}</span><input maxlength="22" value="${esc((prods[n]||[])[0]||'')}" placeholder="${['Caña','Ron cola','Cortado'][n]}">${sel((prods[n]||[])[1]||'cerveza')}</div>`).join('')}`;
  avatarEditor({title:c?'Editar cliente':'Nuevo cliente',a:c&&c.a,name:c&&c.n,nameLabel:'Mote',namePh:'El de la gorra',extra,
    onSave:(a,n,m)=>{
      const f=[0,1].map(i=>m.querySelector(`[data-f="${i}"]`).value.trim());
      const p=[0,1,2].map(i=>{const r=m.querySelector(`[data-p="${i}"]`);return [r.querySelector('input').value.trim(),r.querySelector('select').value]});
      const cid=id||rid();
      put('c:'+cid,{n,a,f,p,ct:c?c.ct:Date.now()},`${myName()}: ${c?'ha editado a':'nuevo cliente:'} ${n}`);
      toast(c?'Cliente guardado':'¡'+n+' ya es cliente!');
    },
    onDelete:c?()=>{if(visit(id))leave(id,true);put('c:'+id,null,`${myName()}: ha borrado a ${c.n}`)}:null});
}
function editWaiter(id){
  const w=id?rec('w:'+id):null;
  avatarEditor({title:w?'Tu camarero':'Nuevo camarero',a:w?w.a:Object.assign(randAvatar(),{ac:6}),name:w&&w.n,nameLabel:'Tu nombre',namePh:'Tu nombre',
    onSave:(a,n)=>{
      const wid=id||rid();
      if(!id&&waiters().length>=MAX_WAITERS){toast('Ya hay '+MAX_WAITERS+' camareros');return false}
      put('w:'+wid,{n,a,ct:w?w.ct:Date.now()},w?null:`¡${n} se une al equipo!`);
      DB.me=wid; save(); if(!w)heartbeat(true); refreshUI();
    },
    onDelete:w?()=>{put('w:'+id,null,`${w.n} deja el equipo`);if(DB.me===id){DB.me=null;save();setTimeout(chooseWaiter,200)}}:null});
}
let whoModal=null;
function chooseWaiter(){
  if(whoModal)whoModal.remove();
  const m=whoModal=modal(`<h3>¿Quién eres?</h3><p>Elige tu camarero. Todo lo que hagas lo verán los demás al momento.</p><div class="who"></div><p class="hint" data-st></p><div class="acts"><button class="btn" data-x>Cerrar</button></div>`);
  m.querySelector('[data-x]').onclick=()=>{m.remove();whoModal=null};
  const fill=()=>{
    const box=m.querySelector('.who');box.innerHTML='';
    for(const w of waiters()){const b=document.createElement('button');b.className='btn'+(w.id===DB.me?' gold':'');b.appendChild(bodyIcon(w.a));const s=document.createElement('span');s.textContent=w.n;b.appendChild(s);
      b.onclick=()=>{DB.me=w.id;save();m.remove();whoModal=null;toast('Hola, '+w.n);heartbeat(true);refreshUI()};box.appendChild(b)}
    if(waiters().length<MAX_WAITERS){const b=document.createElement('button');b.className='btn ok';b.innerHTML='<span style="font-size:40px;line-height:84px">➕</span><span>Soy nuevo</span>';b.onclick=()=>{m.remove();whoModal=null;editWaiter(null)};box.appendChild(b)}
    m.querySelector('[data-st]').textContent=synced?`Hay ${waiters().length} de ${MAX_WAITERS} camareros.`:'Cargando el bar…';
  };
  m._fill=fill; fill();
}
function help(){
  const m=modal(`<h3>Cómo funciona</h3>
  <p>🚶 <b>Llega…</b>: elige el mote del cliente y entra caminando al bar.</p>
  <p>👆 <b>Pulsa sobre un cliente</b> para servirle: elige si paga o le invitan, y luego la bebida o lo de siempre.</p>
  <p>🙂 La carita encima de cada cliente se va emborrachando según lo que lleva (cada copa deja de contar a las 2,5 h).</p>
  <p>👋 <b>Se va</b> cuando sale del bar. ➕ <b>Cliente</b> crea uno nuevo con su aspecto, dos frases típicas y tres cosas que suele pedir.</p>
  <p>📡 Los 3 camareros ven los cambios en tiempo real, también desde casa. Si no hay cobertura, se guarda y se envía al volver.</p>
  <p>🟢 <b>De servicio</b>: sales detrás de la barra. 🏠 <b>En casa</b>: mientras tengas la app abierta, tu avatar aparece en el salón. 📋 <b>Bar</b> resume quién hay, cuánto ha bebido y qué.</p>
  <p>💬 <b>Chat</b>: mensajes entre camareros; salen también en un bocadillo sobre vuestro avatar.</p>
  <p class="hint">Consejo: en iPhone, Compartir → "Añadir a pantalla de inicio" para abrirla como app a pantalla completa.</p>
  <div class="acts"><button class="btn ok" data-x>¡Entendido!</button></div>`);
  m.querySelector('[data-x]').onclick=()=>m.remove();
}
function refreshUI(){uiDirty=true;updateDutyBtn();renderChat();if(openDrop)renderDrop();if(popId)renderPop();if(whoModal&&whoModal._fill)whoModal._fill();
  if(DB.me&&!me()&&synced&&DB.recs['w:'+DB.me]){DB.me=null;save();chooseWaiter()}}

// ====================== ARRANQUE ======================
resize();
requestAnimationFrame(frame);
setInterval(tickClock,15000);
setInterval(()=>{heartbeat();updateDutyBtn()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>heartbeat(),1500)});
setInterval(()=>{if(popId)renderPop()},30000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildStatic());
initialSync();
if(!me())setTimeout(()=>{if(!me())chooseWaiter()},400);
</script>
