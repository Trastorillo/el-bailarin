<style>
:root{--bg:#1b1026;--panel:#2a1a3a;--panel2:#3d2756;--ink:#fff3e0;--dim:#c9b6d8;--acc:#ff5fa2;--acc2:#3ee6c4;--gold:#ffd23f;--line:#0e0714}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'VT323',ui-monospace,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#top{display:flex;gap:6px;align-items:center;padding:5px 8px;background:linear-gradient(#3a2250,#2a1a3a);border-bottom:3px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
#top::-webkit-scrollbar{display:none}
.logo{font-size:24px;color:var(--gold);text-shadow:2px 2px 0 #b3236b;white-space:nowrap;margin-right:4px;letter-spacing:1px}
.btn{font:inherit;font-size:20px;line-height:1.1;color:var(--ink);background:var(--panel2);border:2px solid var(--line);box-shadow:inset -2px -3px 0 rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.18);padding:3px 10px 4px;border-radius:0;white-space:nowrap;cursor:pointer}

.btn.pri{background:#c23c7a}.btn.ok{background:#1f8f78}.btn.warn{background:#a8432a}.btn.gold{background:#b8861b}
.btn:disabled{opacity:.45}
.sp{flex:1}
#status{display:flex;align-items:center;gap:5px;font-size:17px;color:var(--dim);white-space:nowrap}
#status i{width:10px;height:10px;display:inline-block;background:#f0a030;box-shadow:0 0 6px #f0a030}

#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#140b1d}
#scene{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.drop{position:absolute;z-index:30;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.5);min-width:230px;max-width:min(360px,92vw);max-height:calc(100% - 12px);overflow:auto}
.drop h4{margin:0;padding:6px 10px;font-weight:normal;font-size:18px;color:var(--gold);background:#22142f;position:sticky;top:0}
.it{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:20px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer}
.it:active{background:#4a3066}
.it canvas{width:28px;height:28px;image-rendering:pixelated;flex:none;background:#1e1229}
.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#pop{position:absolute;z-index:25;width:min(300px,94vw);background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.5);max-height:calc(100% - 8px);overflow:auto;display:none}

.sw{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle;margin-right:4px}
input,select{font:inherit;font-size:19px;color:var(--ink);background:#1e1229;border:2px solid var(--line);padding:3px 6px;border-radius:0;min-width:0}
input{flex:1}

#toasts{position:absolute;left:8px;bottom:8px;z-index:20;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:60%}

#rot{display:none;position:fixed;inset:0;z-index:60;background:#1b1026;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:20px;gap:14px}
#rot .ph{font-size:64px;animation:spin 2s ease-in-out infinite}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:700px){body:not(.portrait-ok) #rot{display:flex}}
.hint{font-size:16px;color:var(--dim)}
#unread{display:none;margin-left:5px;background:#ff3b5c;color:#fff;font-weight:normal;padding:0 5px;font-size:16px}
#unread.on{display:inline-block}
#bDuty.duty{background:#1f8f78}
#tabs{position:absolute;right:6px;bottom:6px;z-index:22;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
#tabs .btn{font-size:17px;padding:1px 7px;opacity:.85}
#tabs .btn.cur{opacity:1;outline:2px solid var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}

.chips .btn.sel{opacity:1;outline:2px solid var(--gold)}
#chat{position:absolute;top:0;right:0;bottom:0;z-index:28;width:min(340px,62vw);background:var(--panel);border-left:3px solid var(--line);box-shadow:-4px 0 0 rgba(0,0,0,.4);display:none;flex-direction:column}
#chat.on{display:flex}
#chat .ch{display:flex;align-items:center;padding:4px 8px;background:#22142f;color:var(--gold);font-size:20px}

#msgs{flex:1;overflow:auto;padding:6px 8px;display:flex;flex-direction:column;gap:5px}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:18px;line-height:1.05}
.msg canvas{width:24px;height:24px;image-rendering:pixelated;flex:none;background:#1e1229}

.msg.mine .w{color:var(--gold)}
.msg .tx{word-break:break-word;-webkit-user-select:text;user-select:text}
#chat form{display:flex;gap:4px;padding:5px;border-top:2px solid var(--line)}
.sumf{width:22px;height:22px;image-rendering:pixelated;flex:none}
</style>

<script src="peerjs.min.js" async onload="window.startP2P&&startP2P()"></script>
<script>
'use strict';
// ====================== CONFIG ======================
// El bar es privado: la clave va en el enlace (#k=...), nunca se sube a GitHub ni al servidor.
// De ella salen el canal de ntfy, la sala del chat y la llave AES con la que se cifra todo.
let TOPIC=null, PEER_PREFIX=null, AESKEY=null;
function readSecret(){
  const m=/[#&]k=([A-Za-z0-9_-]{8,})/.exec(location.hash||'');
  if(m){lsSet('wl-key',m[1]);return m[1]}
  return lsGet('wl-key');
}
async function sha(txt){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)))}
const hex=a=>[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=a=>btoa(String.fromCharCode(...a));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function setupSecret(sec){
  TOPIC='wl-'+hex(await sha('topic:'+sec)).slice(0,24);
  PEER_PREFIX='wl-'+hex(await sha('peer:'+sec)).slice(0,16)+'-';
  AESKEY=await crypto.subtle.importKey('raw',await sha('aes:'+sec),'AES-GCM',false,['encrypt','decrypt']);
}
async function enc(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},AESKEY,new TextEncoder().encode(JSON.stringify(obj))));return 'E1:'+b64(iv)+':'+b64(ct)}
async function dec(txt){if(typeof txt!=='string'||!txt.startsWith('E1:'))return null;const [,iv,ct]=txt.split(':');
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},AESKEY,unb64(ct))))}catch(e){return null}}
const NTFY = 'https://ntfy.sh/';
const LSKEY = 'waiterlife-v1';
const REPUBLISH_AGE = 6*3600e3;   // ntfy guarda 12 h: lo que tenga más de 6 h se vuelve a enviar
const MAX_WAITERS = 3;

const $ = s => document.querySelector(s);
const rid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// ====================== CATÁLOGO DE ASPECTO ======================
const SKINS = [['Muy clara','#ffe3cc'],['Clara','#f6c9a0'],['Media','#e0a878'],['Morena','#b97a4e'],['Oscura','#7d4a2a'],['Muy oscura','#55301b']];
const HAIRC = [['Negro','#1f1a26'],['Castaño','#5a3420'],['Rubio','#f2cf63'],['Pelirrojo','#c4511f'],['Canoso','#b9b9c4'],['Rosa','#ff7ab8'],['Azul','#4f7dff'],['Verde','#3fbf6a'],['Platino','#f4f1ea']];
const HAIRS = ['Calvo','Rapado','Corto','Flequillo','Cresta','Largo','Coleta','Moño','Rizos','Media melena','Tupé'];
const EYES = ['Normales','Grandes','Felices','Pestañas','Gafas','Gafas de sol','Cejas pobladas'];
const MOUTHS = ['Sonrisa','Seria','Sorpresa','Pícara','Dientes'];
const FACIAL = ['Nada','Bigote','Barba','Perilla','Barba de 3 días'];
const TOPS = ['Camiseta','Camisa','Sudadera','Tirantes','Chaqueta','Rayas','Vestido','Hawaiana'];
const COLORS = [['Blanco','#f2f2f2'],['Negro','#2a2630'],['Rojo','#d23b3b'],['Azul','#3a6fd8'],['Celeste','#7fd3f7'],['Verde','#3fa860'],['Amarillo','#f4c534'],['Rosa','#f27fb2'],['Morado','#8a55c9'],['Naranja','#f08a2c'],['Gris','#8d8d99'],['Marrón','#7a4b2a'],['Vaquero','#3d5a8a'],['Caqui','#8a8a4a']];
const BOTTOMS = ['Pantalón','Pantalón corto','Falda','Chándal'];
const ACCS = ['Nada','Gorra','Gorro de lana','Pendientes','Collar','Pajarita','Delantal','Auriculares','Bandana','Gorro de chef'];
const GENDERS = ['Hombre','Mujer','Género fluido'];
const FIELDS = [
  ['gn','Género',GENDERS],['sk','Piel',SKINS,1],['hs','Peinado',HAIRS],['hc','Color pelo',HAIRC,1],['ey','Ojos',EYES],['mo','Boca',MOUTHS],
  ['fh','Vello facial',FACIAL],['tp','Ropa arriba',TOPS],['tc','Color arriba',COLORS,1],['bt','Ropa abajo',BOTTOMS],
  ['bc','Color abajo',COLORS,1],['ac','Complemento',ACCS]];
function randAvatar(){const a={};for(const [k,,list] of FIELDS)a[k]=Math.floor(Math.random()*list.length);
  if(Math.random()<.6)a.fh=0; if(Math.random()<.5)a.ac=0; if(Math.random()<.6)a.ey=Math.floor(Math.random()*3); return a}

// ====================== BEBIDAS ======================
const DRINKS = {
  cerveza:{e:'🍺',n:'Cerveza',u:1},
  vino:{e:'🍷',n:'Vino',u:1},
  cubata:{e:'🍹',n:'Cubata',u:2},
  licor:{e:'🥃',n:'Licor',u:1.5},
  refresco:{e:'🥤',n:'Refresco',u:0},
  cafe:{e:'☕',n:'Café',u:0},
  comida:{e:'🍽️',n:'Comida',u:0}};
const DRINK_KEYS = Object.keys(DRINKS);
const LEVELS = ['Fresco','Contentillo','Alegre','Piripi','Pedo','K.O.'];
const BURN_MS = 2.5*3600e3; // cada consumición deja de contar a las 2,5 h

// ====================== DATOS (local + ntfy) ======================
let DB = (()=>{try{const d=JSON.parse(lsGet(LSKEY));if(d&&d.recs)return d}catch(e){} return {recs:{},me:null,pending:[]}})();
if(!DB.pending)DB.pending=[];
let CLIENT = lsGet('wl-client'); if(!CLIENT){CLIENT=rid();lsSet('wl-client',CLIENT)}
let saveT=null; function saveNow(){clearTimeout(saveT);saveT=null;lsSet(LSKEY,JSON.stringify(DB))}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
// guardar ya al salir o pasar a segundo plano, y pedir al navegador que no borre los datos
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const rec = k => {const r=DB.recs[k];return r?r.v:null};
let uiDirty = true;
function apply(k,v,t,c){
  const r=DB.recs[k];
  if(r && (r.t>t || (r.t===t && (r.c||'')>=(c||'')))) return false;
  DB.recs[k]={v,t,c}; uiDirty=true; save(); return true;
}
function put(k,v,m){
  const prev=DB.recs[k]; const t=Math.max(Date.now(), prev?prev.t+1:0);
  apply(k,v,t,CLIENT); send({k,v,t,c:CLIENT,m:m||undefined}); refreshUI();
}
function send(msg){DB.pending.push(msg);save();flush()}
let flushing=false, flushTimer=null, backoff=4000;
async function flush(){
  if(flushing||!DB.pending.length||!AESKEY)return; flushing=true;
  try{
    while(DB.pending.length){
      const msg=DB.pending[0];
      const res=await fetch(NTFY+TOPIC,{method:'POST',body:await enc(msg)});
      if(!res.ok) throw new Error('http '+res.status);
      DB.pending.shift(); save(); backoff=4000;
    }
  }catch(e){
    clearTimeout(flushTimer); flushTimer=setTimeout(flush,backoff); backoff=Math.min(backoff*2,60000);
    if(!navigator.onLine) setStatus('off');
  }finally{flushing=false}
}
const seen = {};            // clave -> última vez que la vimos en ntfy (ms)
let lastId = null, synced=false, es=null, esTimer=null;
async function handleNtfy(o, live){
  if(!o||o.event!=='message')return;
  if(o.id)lastId=o.id;
  const m=await dec(o.message);
  if(!m||typeof m.k!=='string'||typeof m.t!=='number'||m.k.length>120)return;
  if(m.v!==null && typeof m.v!=='object')return;
  seen[m.k]=Math.max(seen[m.k]||0,(o.time||0)*1000);
  const changed=apply(m.k,m.v,m.t,m.c);
  if(changed && live && m.c!==CLIENT) onRemote(m);
  if(changed) refreshUI();
}
async function initialSync(){
  setStatus('sync');
  try{
    const res=await fetch(NTFY+TOPIC+'/json?poll=1&since=12h');
    if(!res.ok)throw new Error('http '+res.status);
    const txt=await res.text();
    for(const line of txt.split('\n')){if(!line.trim())continue;try{await handleNtfy(JSON.parse(line),false)}catch(e){}}
    synced=true; refreshUI(); openStream(); flush(); startP2P();
    setTimeout(republish, 3000+Math.random()*9000);
    setInterval(republish, 45*60e3);
  }catch(e){
    setStatus('off'); setTimeout(initialSync, 8000);
  }
}
function openStream(){
  clearTimeout(esTimer); if(es){try{es.close()}catch(e){}}
  es=new EventSource(NTFY+TOPIC+'/sse'+(lastId?'?since='+encodeURIComponent(lastId):''));
  es.onopen=()=>setStatus('live');
  es.onmessage=e=>{try{handleNtfy(JSON.parse(e.data),true).catch(()=>{})}catch(_){}};
  es.onerror=()=>{setStatus(navigator.onLine?'sync':'off');try{es.close()}catch(_){};es=null;esTimer=setTimeout(openStream,5000)};
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(synced)openStream();else initialSync();flush();tickClock()}});
window.addEventListener('online',()=>{flush();if(synced)openStream()});
function prunable(k,r){
  const now=Date.now();
  if(r.v===null) return now-r.t>7*86400e3;
  if(k.startsWith('m:')) return now-r.t>3*86400e3;
  if(k.startsWith('d:')){const [,cid,at]=k.split(':');const b=rec('b:'+cid);return !(b&&b.on&&String(b.at)===at) && now-r.t>36*3600e3}
  return false;
}
function republish(){
  const now=Date.now(); let n=0;
  for(const k of Object.keys(DB.recs)){
    const r=DB.recs[k];
    if(prunable(k,r)){delete DB.recs[k];continue}
    if(k.startsWith('m:')) continue;
    if((seen[k]||0) > now-REPUBLISH_AGE) continue;
    if(DB.pending.some(p=>p.k===k)) continue;
    if(n++>80)break;
    seen[k]=now; DB.pending.push({k,v:r.v,t:r.t,c:r.c});
  }
  save(); flush();
}
function setStatus(s){const el=$('#status');el.className=s==='live'?'live':s==='off'?'off':'';el.lastChild.textContent=s==='live'?'en vivo':s==='off'?'sin conexión':'conectando…'}

// ====================== CONSULTAS ======================

function drinksOf(id){
  const b=visit(id); if(!b)return [];
  const pre='d:'+id+':'+b.at+':';
  return Object.keys(DB.recs).filter(k=>k.startsWith(pre)&&rec(k)).map(k=>({k,...rec(k)})).sort((a,b)=>a.t-b.t);
}
function unitsOf(id){
  const now=Date.now(); let u=0;
  for(const d of drinksOf(id)){const D=DRINKS[d.ty];if(!D)continue;u+=D.u*Math.max(0,1-(now-d.t)/BURN_MS)}
  return u;
}
// con límite propio (botón "cliente ebrio") la carita se gradúa respecto a ese límite: al llegar a él, nivel 4
function drunkLevel(id){
  const u=unitsOf(id), c=cust(id), b=visit(id); let lv;
  if(c&&c.lim){const r=u/c.lim; lv=r<.15?0:r<.35?1:r<.6?2:r<.85?3:r<1.15?4:5}
  else lv=u<0.6?0:u<1.6?1:u<3?2:u<4.5?3:u<6?4:5;
  if(b&&b.drunk)lv=Math.max(lv,4);
  return lv;
}

let peer=null, peerFor=null, p2pState='off'; const CONNS={};
let CHAT=(()=>{try{const c=JSON.parse(lsGet('wl-chat'));if(Array.isArray(c))return c}catch(e){}return []})();
const peerOnline = id => !!(CONNS[id]&&CONNS[id].open);
const onlinePeers = () => waiters().filter(w=>w.id!==DB.me&&peerOnline(w.id));
function startP2P(){
  if(!window.Peer||!DB.me||!me()||!PEER_PREFIX)return;
  if(peer&&peerFor===DB.me&&!peer.destroyed)return;
  stopP2P(); peerFor=DB.me;
  const mk=id=>{
    const pr=peer=new Peer(id,Object.assign({debug:0},window.WL_PEER_OPTS||{})); p2pState='conn';
    pr.on('open',()=>{if(pr!==peer)return;p2pState='ok';connectAll();renderChat()});
    pr.on('connection',c=>setupConn(c));
    pr.on('disconnected',()=>{if(pr===peer&&!pr.destroyed)setTimeout(()=>{try{pr.reconnect()}catch(_){}},3000)});
    pr.on('error',e=>{if(pr!==peer)return;
      if(e.type==='unavailable-id'){pr.destroy();mk(PEER_PREFIX+DB.me+'-'+rid())}   // mismo camarero en otro móvil
      else if(e.type!=='peer-unavailable'){p2pState='err';console.warn('p2p',e.type,e.message);renderChat()}});
  };
  mk(PEER_PREFIX+DB.me);
}
function stopP2P(){for(const k in CONNS){try{CONNS[k].close()}catch(_){}delete CONNS[k]}if(peer){try{peer.destroy()}catch(_){}}peer=null;peerFor=null;p2pState='off'}
function connectAll(){
  if(!peer||!peer.open||peer.destroyed)return;
  for(const w of waiters()){if(w.id===DB.me||peerOnline(w.id))continue;
    try{setupConn(peer.connect(PEER_PREFIX+w.id,{reliable:true}))}catch(_){}}
}
function setupConn(c){
  if(!c)return;
  c.on('open',()=>{try{c.send({t:'hi',w:DB.me})}catch(_){}});
  c.on('data',d=>{
    if(!d||typeof d!=='object')return;
    if(d.t==='hi'&&typeof d.w==='string'&&rec('w:'+d.w)&&d.w!==DB.me){const was=peerOnline(d.w);c._w=d.w;CONNS[d.w]=c;if(!was){const w=rec('w:'+d.w);toast('💬 '+w.n+' se ha conectado');}refreshUI();return}
    if(d.t==='msg'&&c._w&&typeof d.tx==='string'){addChat({by:c._w,tx:d.tx.slice(0,200),t:Date.now()})}
  });
  const gone=()=>{if(c._w&&CONNS[c._w]===c){delete CONNS[c._w];refreshUI()}};
  c.on('close',gone); c.on('error',gone);
}
function addChat(m){
  CHAT.push(m); if(CHAT.length>80)CHAT=CHAT.slice(-80); lsSet('wl-chat',JSON.stringify(CHAT));
  say('w:'+m.by,m.tx,7000);
  if(m.by!==DB.me&&!chatOpen()){const w=rec('w:'+m.by);toast('💬 '+(w?w.n:'?')+': '+m.tx)}
  renderChat();
}

function walls(g,cr,cl){

  for(let i=.5;i<C;i+=.5)rq(g,i,i+.05,4,WALL,'rgba(255,255,255,.05)');
  for(let j=.5;j<R;j+=.5)lq(g,j,j+.05,4,WALL,'rgba(255,255,255,.05)');

  poly(g,[P(0,0,WALL),P(C,0,WALL),P(C,-.35,WALL),P(-.35,-.35,WALL),P(-.35,R,WALL),P(0,R,WALL)],'#2a1838');
}

function pickSpot(z,act,except){
  const spots=SCN[z].spots;
  const used=new Set(inBar().filter(c=>c.id!==except).map(c=>visit(c.id)).filter(b=>zoneOf(b)===z).map(b=>b.s));
  const free=spots.map((s,n)=>n).filter(n=>!used.has(n));
  const withAct=free.filter(n=>spots[n].a.includes(act));
  const pool=withAct.length?withAct:free.length?free:spots.map((s,n)=>n);
  return pool[Math.floor(Math.random()*pool.length)];
}
function actsFor(c,z){const list=(c.acts||[]).filter(a=>ACTS[a]&&SCN[z].spots.some(s=>s.a.includes(a)));return list}
function chooseAct(c,z){const l=actsFor(c,z);return l.length?l[Math.floor(Math.random()*l.length)]:'mirar'}
function moveTo(id,z,act){
  const c=cust(id),b=visit(id);if(!b)return;
  if(!act)act=z===zoneOf(b)?b.act:chooseAct(c,z);
  const s=pickSpot(z,act,id);
  put('b:'+id,Object.assign({},b,{z,act,s,mv:z!==zoneOf(b)?Date.now():b.mv}),z!==zoneOf(b)?`${myName()}: ${c.n} se va a ${ZONES[z][1].toLowerCase()}`:`${c.n}: ${ACTS[act][0]} ${ACTS[act][1].toLowerCase()}`);
  if(z!==VIEW)setView(z);
}
function arrive(id){
  const c=cust(id);if(!c||visit(id))return;
  const z=ZONES[c.z]?c.z:'dentro', act=chooseAct(c,z);
  put('b:'+id,{on:1,z,act,s:pickSpot(z,act,id),at:Date.now()},`${myName()}: ha llegado ${c.n} (${ZONES[z][1].toLowerCase()})`);
  if(z!==VIEW)setView(z);
  setTimeout(()=>{const f=(c.f||[]).filter(Boolean);say(id,f.length?f[Math.floor(Math.random()*f.length)]:'¡Buenas!')},2600);
}
function leave(id,quiet){
  const c=cust(id),b=visit(id);if(!b)return;
  const ds=drinksOf(id),inv=ds.filter(d=>!d.p).length;
  put('b:'+id,{on:0,s:b.s,z:b.z,at:b.at,left:Date.now()},`${myName()}: ${c.n} se va (${ds.length} consumiciones${inv?', '+inv+' invitadas':''})`);
  if(!quiet)say(id,'¡Hasta luego!',2500);
  closePop();
}
function serve(id,ty,label){
  const b=visit(id),c=cust(id);if(!b)return;
  const paid=payMode(id); const D=DRINKS[ty];
  if(DB.me&&!onDuty(DB.me)){setDuty(1);toast('Ahora estás de servicio')}

  FX.push({id,text:'+'+D.e,t0:Date.now()});
  if(DB.me)say('w:'+DB.me,'¡Marchando!',2200);

$('#pop').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||!popId)return; const id=popId,c=cust(id),a=b.dataset.a;
  if(a==='close')closePop();
  else if(a==='paid'){PAY[id]=true;renderPop()}
  else if(a==='inv'){PAY[id]=false;renderPop()}
  else if(a==='d')serve(id,b.dataset.k);
  else if(a==='u'){const u=usualOf(c)[+b.dataset.n];if(u)serve(id,u[1],u[0])}
  else if(a==='z'){moveTo(id,b.dataset.k)}
  else if(a==='act'){moveTo(id,zoneOf(visit(id)),b.dataset.k)}

    put('c:'+id,Object.assign({},cc,{lim}),null); put('b:'+id,Object.assign({},bb,{drunk:1}),`${myName()}: ${cc.n} va ebrio 🥴 (límite ≈ ${fmtU(lim)} copas)`);
    const dm=DRUNK_TYPES[cc.dt]?cc.dt:'pesado'; const l=DRUNK_SAY[dm]; say(id,l[Math.floor(Math.random()*l.length)],3500); renderPop()}

});

  <p>👆 <b>Pulsa sobre un cliente</b> para servirle: elige si paga o le invitan, y luego la bebida o lo de siempre.</p>
  <p>🥴 <b>Cliente ebrio</b>: lo que lleva en ese momento pasa a ser su límite; desde entonces su carita se gradúa con ese límite y, al pasarlo, entra en su modo borrachera (adormecido, pesado, llorón o agresivo, según su ficha).</p>
  <p>🙂 La carita encima de cada cliente se va emborrachando según lo que lleva (cada copa deja de contar a las 2,5 h).</p>
  <p>👋 <b>Se va</b> cuando sale del bar. ➕ <b>Cliente</b> crea uno nuevo con su aspecto, dos frases típicas y tres cosas que suele pedir.</p>
  <p>🔒 El bar es privado: solo entra quien tenga el enlace con la clave, y todo lo que se envía va cifrado con ella.</p>
  <p>📡 Los 3 camareros ven los cambios en tiempo real, también desde casa. Si no hay cobertura, se guarda y se envía al volver.</p>
  <p>🟢 <b>De servicio</b>: sales detrás de la barra. 🏠 <b>En casa</b>: mientras tengas la app abierta, los demás ven tu avatar en el salón. 📋 <b>Bar</b> resume quién hay, cuánto ha bebido y qué.</p>
  <p>🚪 Pulsa las puertas o las pestañas de abajo para ir a la sala y cocina (con Vidal), la terraza de atrás o la de alante. 🎉 <b>Evento</b> pone, por ejemplo, el partido en las teles.</p>
  <p>💬 <b>Chat</b>: directo entre móviles (no gasta el límite gratuito). Solo llega a quien tiene la app abierta a la vez y sale en un bocadillo sobre su avatar.</p>
  <p>💾 Los clientes se guardan en cada móvil y se reparten entre los tres. En ⋯ puedes guardar una copia de seguridad en un archivo.</p>
  <p class="hint">Consejo: en iPhone, abre el enlace privado en Safari y luego Compartir → "Añadir a pantalla de inicio".</p>
  <div class="acts"><button class="btn ok" data-x>¡Entendido!</button></div>`);
  m.querySelector('[data-x]').onclick=()=>m.remove();
}
function refreshUI(){uiDirty=true;renderTabs();updateDutyBtn();renderChat();if(openDrop)renderDrop();if(popId)renderPop();if(whoModal&&whoModal._fill)whoModal._fill();
  if(DB.me&&!me()&&synced&&DB.recs['w:'+DB.me]){DB.me=null;save();chooseWaiter()}}

// ====================== ARRANQUE ======================
resize();
requestAnimationFrame(frame);
setInterval(tickClock,15000);
setInterval(updateDutyBtn,60000);
setInterval(()=>{if(popId)renderPop()},30000);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>buildStatic());
(async()=>{
  const sec=readSecret();
  if(!sec||!window.crypto||!crypto.subtle){lockScreen();return}
  await setupSecret(sec);
  initialSync();
  if(!me())setTimeout(()=>{if(!me())chooseWaiter()},400);
})();
function lockScreen(){
  const m=modal(`<h3>🔒 Bar privado</h3><p>WaiterLife solo funciona con el enlace privado que comparten los camareros.</p>
   <p>Ábrelo desde ese enlace, o pega aquí el enlace o la clave:</p>
   <p class="hint">Si lo abriste desde un icono antiguo de la pantalla de inicio, bórralo, abre el enlace privado y vuelve a añadirlo a inicio desde ahí.</p><div class="row"><input data-k placeholder="https://…#k=… o la clave"><button class="btn ok" data-ok>Entrar</button></div>`);
  m.querySelector('[data-ok]').onclick=()=>{const v=m.querySelector('[data-k]').value.trim();const mm=/k=([A-Za-z0-9_-]{8,})/.exec(v)||/^([A-Za-z0-9_-]{8,})$/.exec(v);
    if(!mm){m.querySelector('[data-k]').style.borderColor='#ff4a4a';return}
    lsSet('wl-key',mm[1]);location.hash='k='+mm[1];location.reload()};
}
function exportBackup(){
  const recs={};for(const k in DB.recs){if(/^[cwk]:/.test(k)&&DB.recs[k].v)recs[k]=DB.recs[k]}
  const blob=new Blob([JSON.stringify({app:'waiterlife',v:1,at:Date.now(),recs})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='waiterlife-copia-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('Copia guardada ('+Object.keys(recs).filter(k=>k.startsWith('c:')).length+' clientes)');
}
function importBackup(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{try{const d=JSON.parse(await inp.files[0].text());if(!d||d.app!=='waiterlife'||!d.recs)throw 0;let n=0;
    for(const [k,r] of Object.entries(d.recs)){if(typeof k==='string'&&/^[cwk]:/.test(k)&&r&&typeof r.t==='number'&&r.v&&typeof r.v==='object'&&apply(k,r.v,r.t,r.c)){send({k,v:r.v,t:r.t,c:r.c});n++}}
    saveNow();refreshUI();toast(n?`Recuperados ${n} registros`:'No había nada nuevo en la copia')}catch(e){toast('Ese archivo no es una copia de WaiterLife')}};
  inp.click();
}
function shareLink(){
  const sec=lsGet('wl-key');if(!sec)return;const url=location.origin+location.pathname+'#k='+sec;
  if(navigator.share)navigator.share({title:'WaiterLife',text:'El enlace privado del bar (solo para camareros):',url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Enlace privado copiado'),()=>toast(url));
  else toast(url);
}
</script>
